[workspace]
members = ["crates/*"]
exclude = ["tmp/*", "crates/app-cli"]
resolver = "2"

default-members = [
    "crates/rcoder",
    "crates/agent_runner",
    "crates/shared_types",
    "crates/docker_manager",
    "crates/rcoder-proxy",
    "crates/container-runtime-api",
    "crates/rcoder-cli",
    "crates/rcoder-gateway",
    "crates/download_utils",
    "crates/agent_provisioning",
    "crates/app_manager",
]


[workspace.lints]
rustdoc.unescaped_backticks = "warn"
rustdoc.redundant_explicit_links = "warn"
rust.unused_lifetimes = "warn"
# 防回归: 多余路径限定 (如 `crate::foo::Bar` 而 `Bar` 已在作用域内) 降低可读性。
# 存量已清零, 升级 deny 拦截新增; prost 生成代码在 shared_types_grpc 内局部 allow。
rust.unused_qualifications = "deny"
rust.variant_size_differences = "warn"
# 防回归: `let _ = x;` 静默丢弃带 Drop 语义的值 (如 guard/receiver) 会埋隐患。
# 存量较多暂用 warn 防新增; 存量清零后可升级为 deny。
rust.let_underscore_drop = "warn"

[workspace.lints.clippy]
# 防回归: sync Mutex 跨 await 持有会阻塞 executor 线程并引入死锁风险。
# 当前无存量违规, deny 直接拦截新增; CI 配合 `-D warnings` 兑现。
await_holding_lock = "deny"

[workspace.package]
version = "0.1.3"
edition = "2024"
authors = ["soddy <soddygo@qq.com>"]
license = "Apache-2.0"
description = "Rust-based AI agent framework"
homepage = "https://github.com/nuwax-ai/rcoder"
repository = "https://github.com/nuwax-ai/rcoder"
publish = false

[workspace.dependencies]
# ACP Protocol - 官方 SDK（完全 Send-safe，无需 LocalSet）
agent-client-protocol = { version = "2" }

# MCP 协议 - rmcp 官方库
rmcp = { version = "1.8"}
# mcp-proxy convert fallback 参数解析与文件重写。
mcp-proxy-args = { version = "=0.2.3" }

piper = "0.2"

clap = { version = "4.6", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "time"] }
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"

# HTTP server
axum = { version = "0.8", features = [
    "http2",
    "query",
    "tracing",
    "ws",
    "multipart",
    "macros",
] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "set-header", "fs"] }
hyper = { version = "1.8", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
# gRPC。tonic 0.14 全系 TLS 特性均基于 rustls：tls-native-roots = rustls + 系统根证书(rustls-native-certs)，
# 并非 native-tls。保留以信任私有部署的系统/私有 CA（与 reqwest 的 rustls-platform-verifier 一致）。
tonic = { version = "0.14.6", features = ["tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"

# WebSocket（终端中间层：接浏览器 + 连本地 ttyd）
tokio-tungstenite = "0.29"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "=0.9.33"
serde_urlencoded = "0.7"
schemars = { version = "1.2", features = ["derive"] }
config = "0.15"

# Validation
garde = { version = "0.22.1", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# OpenTelemetry
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = [
    "grpc-tonic",
    "http-proto",
] }
tracing-opentelemetry = "0.33"
axum-tracing-opentelemetry = "0.38"

# Prometheus Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# UUID
uuid = { version = "1.23", features = ["serde", "v4", "v7"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# File system watching
notify = "8.2"

# File system utilities
tokio-fs = "0.1"
path-clean = "1.0"

# Utilities
dashmap = "6.2"
futures = "0.3"
futures-util = "0.3"
itertools = "0.15"
bytes = "1.12"
arrayvec = "0.7"
arc-swap = "1.9"
md5 = "0.8"
process-wrap = { version = "9.0", features = ["tokio1", "process-group", "job-object"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }

url = { version = "2.5", features = ["serde"] }
percent-encoding = "2.3"

# TLS/Crypto
rustls = { version = "0.23", features = ["ring"] }

# Additional utilities
indoc = "2.0"
parking_lot = "0.12"
lockmap = "0.2.3"
convert_case = "0.11"
# Persistent data structures for CoW-friendly multi-session tracking (C2/M3 fix)
im = { version = "15.1", features = ["serde"] }
handlebars = { version = "6.3", features = ["rust-embed"] }
rust-embed = "8.0"
zstd = "0.13"

# Kubernetes
kube = { version = "4.0", features = ["runtime", "client", "kube-runtime", "config", "ws"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }


# 构建工具
derive_builder = "0.20"

# Zed 核心功能依赖
libc = "0.2"
nix = { version = "0.31.3", features = ["fs", "process", "term", "signal"] }
# /proc 解析（agent_runner 统计容器内 noVNC 端口 ESTABLISHED 连接，判 VNC 桌面是否在用）。
# 仅在 Linux target 的 agent_runner 里引入（target-gated），Mac 开发编译不拉它。
procfs = "0.18"
unindent = "0.2"                                                   # 使用 crates.io 版本
open = "5.0"                                                       # 使用 crates.io 版本
git2 = "0.21"
tree-sitter-rust = "0.24"                                          # 使用 crates.io 版本


# Additional dependencies for nuwax_parser
sha2 = "0.11"
hex = "0.4"
walkdir = "2.5"
# HTTP client。reqwest 0.13 的 default-tls 本就是 rustls(aws-lc-rs + rustls-platform-verifier 读 OS 根证书)，
# 并无 openssl/native-tls。这里 default-features=false + 显式 rustls 固化“全 workspace 用 rustls”，
# 防止未来 reqwest 改默认后悄悄回退；charset/http2/system-proxy 补回原默认特性。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls",
    "charset",
    "http2",
    "system-proxy",
] }

# 项目依赖 - 保留核心功能
aho-corasick = "1.1"
base64 = "0.22"
circular-buffer = "2.0"
fancy-regex = "0.18"
fuzzy = "0.0.1"
globset = "0.4"
image = "0.25"
indexmap = "2.14"
pathdiff = "0.2"
postage = "0.5"
regex = "1.12"
semver = "1.0"
# npm/node 版本范围语义（与 package.json 依赖版本一致；不同于 Cargo semver）
node-semver = "2.2"
shellexpand = "3.1"
winnow = "1.0.3"
workspace-manifest = { path = "crates/workspace-manifest" }
shlex = "2.0"
smallvec = "1.15"

toml = "1.1.2"
which = "8.0"


# Dev dependencies for testing
ctor = "1.0.7"
pretty_assertions = "1.4"
tempfile = "3.24"
filetime = "0.2"
rand = "0.10"
tokio-test = "0.4"
expect-test = "1.5"

# File system utilities
dirs = "6.0"

# Archive utilities
flate2 = "1.1"
tar = "0.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

utoipa = { version = "5.4", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }


ringbuf = "0.5"


diffy = { version = "0.5" }

pingora = { version = "0.8", features = ["lb", "rustls"] }
pingora-core = { version = "0.8", features = ["rustls"] }
pingora-http = "0.8"
pingora-proxy = { version = "0.8", features = ["rustls"] }
pingora-load-balancing = { version = "0.8", features = ["rustls"] }
matchit = "0.9.2"
structopt = "0.3"

bollard = { version = "0.21" }

# Cache library
moka = { version = "0.12", features = ["future", "sync"] }

# TUI
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = "0.13"
unicode-width = "0.2"

# 编码检测 / content-type 推断 (file-server)
encoding_rs = "0.8"
mime_guess = "2"

# Git (file-server, 纯 Rust; gitoxide 0.85 源码可参考)
gix = { version = "0.85", features = ["tree-editor"] }

# i18n (国际化)
rust-i18n = "4"

# Internal crates
rcoder-telemetry = { path = "crates/rcoder-telemetry" }
shared_types = { path = "crates/shared_types" }
shared_types_grpc = { path = "crates/shared_types_grpc" }
shared_types_i18n = { path = "crates/shared_types_i18n" }
agent_config = { path = "crates/agent_config" }
agent_abstraction = { path = "crates/agent_abstraction" }
agent_provisioning = { path = "crates/agent_provisioning" }
docker_manager = { path = "crates/docker_manager" }
rcoder-proxy = { path = "crates/rcoder-proxy" }
container-runtime-api = { path = "crates/container-runtime-api" }
download_utils = { path = "crates/download_utils" }
process_utils = { path = "crates/process_utils" }
file-server = { path = "crates/file-server" }

# Pyroscope Continuous Profiling
pyroscope = { version = "2.0", features = ["backend-pprof-rs"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
