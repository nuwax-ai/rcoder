[package]
name = "file-server-proxy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "file_server_proxy"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true }

# 轻量 HTTP 反代用 hyper: 生命周期需可编程 start/stop/restart
# (pingora Server run_forever 无停机 API, 无法支撑运行时切换 60000 归属)
hyper = { workspace = true, features = ["client"] }
hyper-util = { workspace = true, features = ["client", "client-legacy"] }
http-body-util = { workspace = true }

# 跨 crate 契约: x-service-type 分流 header 定义在 shared_types（防双头事实源）
shared_types = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
