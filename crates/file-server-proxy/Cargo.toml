[package]
name = "file-server-proxy"
# 独立版本号: 支持 file-server-proxy 单独打 tag (file-server-proxy-v*) 经 CI 发
# npm/OSS, 与 rcoder 主版本解耦 (与 crates/file-server 同款纪律)。
# 0.1.2: start 存活判定 health 化 + detached child 僵尸修复
version = "0.1.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# 内嵌 Rust file-server (npm 独立分发形态): proxy 单二进制自带 rust 上游,
# 同进程 task 绑 127.0.0.1:{RUST_UPSTREAM_PORT}。容器/rcoder 嵌入形态不启用
# (上游由 supervisord 独立进程/宿主进程提供)。
embed-file-server = ["dep:file-server"]

[lib]
name = "file_server_proxy"
path = "src/lib.rs"

# 独立入口：默认=生产运行容器形态（纯转发，supervisord program，60000 → 本容器
# file-server）；--features embed-file-server = npm 独立分发形态（内嵌 rust 上游）。
[[bin]]
name = "file-server-proxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true }

# 轻量 HTTP 反代用 hyper: 生命周期需可编程 start/stop/restart
# (pingora Server run_forever 无停机 API, 无法支撑运行时切换 60000 归属)
hyper = { workspace = true, features = ["client"] }
hyper-util = { workspace = true, features = ["client", "client-legacy"] }
http-body-util = { workspace = true }

# 跨 crate 契约: x-service-type 分流 header 定义在 shared_types（防双头事实源）
shared_types = { workspace = true }

# bin 入口的日志初始化（lib 内只发事件不装 subscriber）
tracing-subscriber = { workspace = true }

# npm 独立形态的可选内嵌 rust 上游 (feature embed-file-server)
file-server = { workspace = true, optional = true }

[dev-dependencies]
serde_yaml = { workspace = true }
tokio = { workspace = true }
