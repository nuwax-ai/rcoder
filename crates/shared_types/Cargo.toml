[package]
name = "shared_types"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []

[dependencies]

serde.workspace = true
serde_json.workspace = true
semver = { workspace = true }
winnow = { workspace = true }
dashmap = { workspace = true }
uuid.workspace = true
# ACP Protocol - 官方 SDK（完全 Send-safe，无需 LocalSet）
agent-client-protocol = { workspace = true }
chrono.workspace = true

# OpenAPI documentation
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "fmt",
    "env-filter",
    "json",
] }

tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }

thiserror = { workspace = true }

# Validation
garde = { version = "0.22.1", features = ["derive"] }

base64 = { workspace = true }

derive_builder = { workspace = true }

reqwest = { workspace = true }

anyhow = { workspace = true }

# URL 解析
url = { workspace = true }

# OpenTelemetry
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
tracing-opentelemetry = { workspace = true }
axum-tracing-opentelemetry = { workspace = true }

# 🚀 无锁配置热更新
arc-swap = "1.8"

# Persistent data structures for multi-session tracking (C2/M3 fix)
im = { workspace = true }

# i18n (国际化)
shared_types_i18n = { path = "../shared_types_i18n" }

# URL query string 解析
serde_urlencoded = "0.7"


# HTTP server
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }
futures = { workspace = true }
futures-util = { workspace = true }
tokio-stream = "0.1"

# async trait for service trait definition
async-trait = { workspace = true }

# gRPC types (extracted to shared_types_grpc)
shared_types_grpc = { path = "../shared_types_grpc" }

[dev-dependencies]
serde_yaml = "=0.9.33"
