[package]
name = "process_utils"
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
description = "Unix 进程信号工具: 带 PID 1 防御的进程组 kill (file-server / agent_abstraction / app-cli 共用)"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
sha2 = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
process-wrap = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
rustix = { workspace = true, features = ["process", "param"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }
which = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]

# procfs 只支持 Linux/Android:macOS 开发机上不参与构建,
# 这样 process_utils 仍能跨平台编译(cfg(target_os="linux") 之外的路径不用它)。
[target.'cfg(target_os = "linux")'.dependencies]
procfs = { workspace = true }
