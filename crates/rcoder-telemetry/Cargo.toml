[package]
name = "rcoder-telemetry"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared telemetry module for rcoder services (Prometheus + OTLP)"
publish = false

[lints]
workspace = true

[dependencies]
tracing-flame = { workspace = true, optional = true }
# OpenTelemetry
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

# Prometheus
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Axum 中间件
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }

# gRPC (Tonic)
tonic = { workspace = true }

# 其他
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing-appender = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
pin-project-lite = { workspace = true }

[features]
# tracing 火焰图观测（flame feature；输出 .folded 文件，inferno-flamegraph 渲染）
flame = ["dep:tracing-flame"]
default = []
# 启用完整的 OTLP 功能
full = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
