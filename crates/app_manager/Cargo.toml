[package]
name = "app_manager"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Kubernetes 后端模式：启用后 AppAccessMode 默认值 = Kubernetes（仍可被 env 覆盖）
# 由 rcoder 的 kubernetes feature 转发开启，保持双后端编译期同源。
kubernetes = []

[lints]
workspace = true

[dependencies]
# Internal crates
container-runtime-api = { workspace = true }
docker_manager = { workspace = true }
rcoder-proxy = { workspace = true }
shared_types = { workspace = true }
download_utils = { workspace = true }
workspace-manifest = { workspace = true }

# Async runtime
async-trait = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

# shared_types 持久化契约(AppMetadataPersistence 等)的签名使用 anyhow::Result
anyhow = { workspace = true }

# HTTP server
axum = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }

# Date/time
chrono = { workspace = true }

# Concurrency
dashmap = { workspace = true }

# Cache
moka = { workspace = true }

# UUID
uuid = { workspace = true }

# Logging
tracing = { workspace = true }

# OpenAPI
utoipa = { workspace = true }

# Temp files
tempfile = { workspace = true }
tokio-util = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zip = { workspace = true }
