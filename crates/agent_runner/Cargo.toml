[package]
name = "agent_runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = false

[lib]
name = "agent_runner"
path = "src/lib.rs"

[features]
# tokio-console 观测（本地开发专用；编译须配 RUSTFLAGS="--cfg tokio_unstable"）
console = ["dep:console-subscriber"]
default = ["http-server", "grpc-server"]

# HTTP 服务器功能：启用 HTTP REST API 和 SSE 进度流
# 注意：启用 http-server 时会同时启动 gRPC（除非明确禁用）
http-server = []

# gRPC 服务功能：启用 gRPC 服务
# 在 http-server 模式下：
#   - 启用 grpc-server：同时运行 HTTP + gRPC
#   - 禁用 grpc-server：仅运行 HTTP（无 gRPC）
grpc-server = []

# Pingora 代理模式：API Key 和 Base URL 使用占位符，由 Pingora 代理注入真实值
# Windows 不支持 Pingora，禁用此 feature 时直接使用真实的 API Key 和 Base URL
proxy = ["dep:rcoder-proxy"]

# 测试相关 features
testing = ["test-blocking"]
test-blocking = []  # 启用测试用阻塞注入 (用于极端场景测试)

# OpenTelemetry 追踪 feature
otel = []  # 启用 OpenTelemetry 追踪功能

# Pyroscope 连续性能分析
pyroscope = ["dep:pyroscope"]

# Hotpath 本地性能剖析（hotpath-rs；仅本地开发，不进 default，与 pyroscope 可共存）。
# feature 关闭时 hotpath 宏全部 no-op、零依赖编译，代码里宏裸用不配 cfg。
# axum-0-8 供 http_server/router.rs 装配处 hotpath::axum!（关闭时原样返回 router）；
# tokio 供 hotpath::tokio_runtime!() runtime 指标线程。
hotpath = ["hotpath/hotpath", "hotpath/threads", "hotpath/tokio", "hotpath/axum-0-8"]
# 叠加内存分配剖析（依赖本 crate hotpath；开启后 #[hotpath::main] 安装计数全局分配器）
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
# 叠加 MCP server（127.0.0.1:6771，AI 实时查询性能数据；见 AGENTS.md）
hotpath-mcp = ["hotpath", "hotpath/hotpath-mcp"]

[lints]
workspace = true

[dependencies]
# Internal crates
shared_types = { workspace = true }
shared_types_grpc = { workspace = true }
shared_types_i18n = { workspace = true }
agent_config = { workspace = true }
agent_abstraction = { workspace = true }
agent_provisioning = { workspace = true }
download_utils = { workspace = true }
model_probe = { workspace = true }
file-server = { workspace = true }
file-server-userapp = { workspace = true }
file-server-proxy = { workspace = true }
rcoder-proxy = { workspace = true, optional = true }
rcoder-telemetry = { workspace = true }
console-subscriber = { workspace = true, optional = true }

clap = { workspace = true }
# ACP Protocol - 官方 SDK（完全 Send-safe，无需 LocalSet）
agent-client-protocol = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }

# PID 1 init: 容器内做 PID 1 的孤儿回收 + 信号转发(经 re-exec 等价 tini,进程外 waitpid 不与 tokio 冲突)
pid1 = "0.1.6"

# HTTP server
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "limit"] }
futures = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }

# gRPC Server
tonic = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
regex = { workspace = true }
globset = { workspace = true }
shlex = { workspace = true }

derive_builder = { workspace = true }

# Workspace dependencies
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "fmt",
    "env-filter",
    "json",
] }
tracing-appender = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
dashmap = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
piper = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }

# Archive extraction (binary_installer) with path-traversal + zip-bomb protection
hex = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }

# OpenTelemetry
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
tracing-opentelemetry = { workspace = true }
axum-tracing-opentelemetry = { workspace = true }

# File system
path-clean = { workspace = true }
which = { workspace = true }

# OpenAPI documentation
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# Validation
garde = { workspace = true }

ringbuf = { workspace = true }

# Atomic swap for sender replacement
arc-swap = { workspace = true }

# WebSocket：终端中间层（接浏览器 + 连本地 ttyd）+ noVNC 代理可用性检查
tokio-tungstenite = { workspace = true }

# Pyroscope Continuous Profiling
pyroscope = { workspace = true, optional = true }

# 本地性能剖析（hotpath-rs）：非 optional，feature 由上方 hotpath* 打开内部特性
hotpath = { workspace = true }

# Unix 信号处理（用于僵尸进程回收，仅 Unix 平台）
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

# /proc 解析（agent_runner 统计容器内 noVNC 端口 ESTABLISHED 连接，判 VNC 桌面是否在用）
# 仅 Linux target 引入；macOS 开发 cargo check/test 不拉此依赖，保持 Mac 编译干净。
[target.'cfg(target_os = "linux")'.dependencies]
procfs = { workspace = true }

[dev-dependencies]
# 集成测试用:解析响应 body
http-body-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
# 集成测试用:tokio::time 虚拟时钟（pause/advance 快进），避免 keepalive 30s 真实等待
tokio = { workspace = true, features = ["test-util"] }
