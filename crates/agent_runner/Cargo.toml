[package]
name = "agent_runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = false

[lib]
name = "agent_runner"
path = "src/lib.rs"

[features]
default = ["http-server", "grpc-server"]

# HTTP 服务器功能：启用 HTTP REST API 和 SSE 进度流
# 注意：启用 http-server 时会同时启动 gRPC（除非明确禁用）
http-server = []

# gRPC 服务功能：启用 gRPC 服务
# 在 http-server 模式下：
#   - 启用 grpc-server：同时运行 HTTP + gRPC
#   - 禁用 grpc-server：仅运行 HTTP（无 gRPC）
grpc-server = []

# Pingora 代理模式：API Key 和 Base URL 使用占位符，由 Pingora 代理注入真实值
# Windows 不支持 Pingora，禁用此 feature 时直接使用真实的 API Key 和 Base URL
proxy = ["dep:rcoder-proxy"]

# 测试相关 features
testing = ["test-blocking"]
test-blocking = []  # 启用测试用阻塞注入 (用于极端场景测试)

# OpenTelemetry 追踪 feature
otel = []  # 启用 OpenTelemetry 追踪功能

# Pyroscope 连续性能分析
pyroscope = ["dep:pyroscope"]

[dependencies]
# Internal crates
shared_types = { workspace = true }
shared_types_grpc = { workspace = true }
shared_types_i18n = { workspace = true }
agent_config = { workspace = true }
agent_abstraction = { workspace = true }
download_utils = { workspace = true }
rcoder-proxy = { workspace = true, optional = true }
rcoder-telemetry = { workspace = true }

clap = { workspace = true }
# ACP Protocol - 官方 SDK（完全 Send-safe，无需 LocalSet）
agent-client-protocol = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }

# HTTP server
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "limit"] }
futures = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }

# gRPC Server
tonic = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
regex = { workspace = true }
globset = { workspace = true }
shlex = { workspace = true }

derive_builder = { workspace = true }

# Workspace dependencies
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "fmt",
    "env-filter",
    "json",
] }
tracing-appender = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
dashmap = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
piper = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }

# Archive extraction (binary_installer) with path-traversal + zip-bomb protection
hex = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }

# OpenTelemetry
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
tracing-opentelemetry = { workspace = true }
axum-tracing-opentelemetry = { workspace = true }

# File system
tokio-fs = { workspace = true }
path-clean = { workspace = true }
which = { workspace = true }

# OpenAPI documentation
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# Validation
garde = { workspace = true }

ringbuf = { workspace = true }

# Atomic swap for sender replacement
arc-swap = { workspace = true }

# WebSocket：终端中间层（接浏览器 + 连本地 ttyd）+ noVNC 代理可用性检查
tokio-tungstenite = { workspace = true }

# Pyroscope Continuous Profiling
pyroscope = { workspace = true, optional = true }

# Unix 信号处理（用于僵尸进程回收，仅 Unix 平台）
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[dev-dependencies]
# 集成测试用:解析响应 body
http-body-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
# 集成测试用:tokio::time 虚拟时钟（pause/advance 快进），避免 keepalive 30s 真实等待
tokio = { workspace = true, features = ["test-util"] }
