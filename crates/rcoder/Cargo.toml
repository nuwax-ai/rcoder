[package]
name = "rcoder"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = false

[lib]
name = "rcoder"
path = "src/lib.rs"

[features]
default = []

# 调试功能：启用 /debug/* 路由，用于开发和问题排查
# 生产环境默认不启用，需要显式添加 --features debug
debug = []


# tokio-console 观测（本地开发专用；编译须配 RUSTFLAGS="--cfg tokio_unstable"，
# 见 make run-console / DEV_CONSOLE=1 make dev-hot）。release 不启用=零代码零开销。
console = ["dep:console-subscriber"]

# 🔧 eBPF 调试模式：启用容器特权，允许使用 eBPF 诊断工具
# 警告：仅在开发调试时使用，生产环境请勿启用
# 此 feature 会传递给 docker_manager crate
ebpf-debug = ["docker_manager/ebpf-debug"]

# Kubernetes 支持：启用 Kubernetes 运行时模式
# 启用后可通过 CONTAINER_RUNTIME=kubernetes 环境变量切换到 K8s 模式
kubernetes = ["docker_manager/kubernetes", "shared_types/kubernetes", "app_manager/kubernetes", "file-server/kubernetes", "kube", "k8s-openapi"]

# PostgreSQL 持久化存储后端（rcoder-storage/pg 转发）。
# 运行期经 [storage].backend / RCODER_STORAGE_BACKEND=postgres 激活（env 可灰度回退 memory）；
# 仅 k8s 编译变体启用（docker compose 路径不编译 sqlx，行为零改动）
rcoder-pg = ["kubernetes", "rcoder-storage/pg"]

[dev-dependencies]
filetime = { workspace = true }
http-body-util = { workspace = true }

[lints]
workspace = true

[dependencies]
# Internal crates
shared_types = { workspace = true }
rcoder-storage = { workspace = true }
rcoder-proxy = { workspace = true }
container-runtime-api = { workspace = true }
download_utils = { workspace = true }
agent_provisioning = { workspace = true }
file-server = { workspace = true }
app_manager = { path = "../app_manager" }

# 🚀 无锁配置热更新
arc-swap = { workspace = true }
docker_manager = { workspace = true }
rcoder-telemetry = { workspace = true }
console-subscriber = { workspace = true, optional = true }

clap = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
lockmap = { workspace = true }
tempfile = { workspace = true }

# HTTP server
axum = { workspace = true, features = ["multipart", "ws"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "set-header", "limit"] }
hyper = { workspace = true }
hyper-util = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }

# gRPC Client
tonic = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde_urlencoded = { workspace = true }

# Validation
garde = { workspace = true }
regex = { workspace = true }

# Parsing
winnow = { workspace = true }

derive_builder = { workspace = true }

# Workspace dependencies
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "fmt",
    "env-filter",
    "json",
] }
tracing-appender = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
dashmap = { workspace = true }
notify = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
piper = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
bollard = { workspace = true }
rustls = { workspace = true }

# OpenTelemetry
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
tracing-opentelemetry = { workspace = true }
axum-tracing-opentelemetry = { workspace = true }

# File system
tokio-fs = { workspace = true }
path-clean = { workspace = true }

# OpenAPI documentation
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

ringbuf = { workspace = true }

# Random and hashing
rand = { workspace = true }
md5 = { workspace = true }

# Cache
moka = { workspace = true }

# Kubernetes (optional)
kube = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
