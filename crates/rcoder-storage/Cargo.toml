[package]
name = "rcoder-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

# PostgreSQL 持久化后端（write-behind + 启动全量加载）。
# 未选择 pg 后端时不编译 sqlx。
# rcoder 侧经 feature `rcoder-pg = ["kubernetes", "rcoder-storage/pg"]` 转发开启。
pg = ["sqlx", "sqlx/postgres", "moka"]
# 本地 Turso 控制存储（specs/userapp-turso-local-storage，替代 SQLx SQLite）。
# default-features = false 裁掉 FTS/分配器等无需求项；nix 供独占目录锁使用。
userapp-turso = ["dep:turso", "dep:futures", "dep:sha2", "dep:nix"]

[lints]
workspace = true

[dependencies]
shared_types = { workspace = true }

# 内存镜像与并发结构
dashmap = { workspace = true }
lockmap = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
percent-encoding = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }

# SQL 后端（feature-gated）
sqlx = { workspace = true, optional = true }
# Touch 节流表（pg 模式：TTI 过期防 key 泄漏）
moka = { workspace = true, optional = true }

uuid = { workspace = true }
nix = { workspace = true, optional = true }
turso = { version = "0.8.0-pre.11", default-features = false, optional = true }
futures = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# PG 契约测试复用 preview-coordinator 的存储契约断言全集
preview-coordinator = { workspace = true }
