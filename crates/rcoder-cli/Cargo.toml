[package]
name = "rcoder-cli"
version = "0.1.5"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI tool for testing ACP agents locally"
homepage.workspace = true
repository.workspace = true
publish = false

[package.metadata.dist]
dist = true

[[bin]]
name = "rcoder-cli"
path = "src/main.rs"

[dependencies]
# Internal crates
agent_abstraction = { workspace = true }
shared_types = { workspace = true }

# ACP Protocol SDK
agent-client-protocol = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["signal"] }
async-trait = { workspace = true }

# CLI argument parsing
clap = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Date/time
chrono = { workspace = true }

# Concurrent collections (SimpleSessionRegistry — required by SessionRegistry trait's entry() API)
dashmap = { workspace = true }

# TUI
ratatui = { workspace = true }
crossterm = { workspace = true }
pulldown-cmark = { workspace = true }
unicode-width = { workspace = true }
futures = { workspace = true }

# Serialization (for debug output)
serde_json = { workspace = true }
