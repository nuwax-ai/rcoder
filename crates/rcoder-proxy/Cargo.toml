[package]
name = "rcoder-proxy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "rcoder_proxy"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Core dependencies
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
matchit = { workspace = true }

# Pingora dependencies - 真正的 Pingora 库
pingora = { workspace = true }
pingora-core = { workspace = true }
pingora-http = { workspace = true }
pingora-proxy = { workspace = true }
pingora-load-balancing = { workspace = true }
async-trait = { workspace = true }

# URL parsing for masking
url = { workspace = true }
# 终端 query 参数 percent-decode（form 语义）
percent-encoding = { workspace = true }

# Shared types for API config
shared_types = { workspace = true }

# 🚀 无锁配置热更新
arc-swap = { workspace = true }

serde_json = { workspace = true }
# 失败出口 OTel span（编号→日志 trace_id→Tempo 精确串联；错误路径专用，
# 成功请求零开销）。版本与 shared_types/rcoder-telemetry 同源（workspace）。
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }

[features]
default = []
# deploy-host 宿主机运行形态（dial_addr 统一出口）
deploy-host = ["shared_types/deploy-host"]
