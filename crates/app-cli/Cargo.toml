[package]
name = "app-cli"
version = "0.3.23"
edition = "2024"
license = "Apache-2.0"
description = "Cross-platform UserApp build and service manager with orchestration, Pingap routing, and a management API"
# app-cli 是 rcoder workspace 成员（2026-11-18 并入）：原 exclude 理由（pingap-config
# 传递依赖 bollard/regex 与主锁冲突）已消失——bollard 双方同为 0.21.1，可统一解析。
# 全部依赖（含本 crate 专用依赖与共用 path crate）统一在根 [workspace.dependencies] 维护。

[lib]
name = "app_cli"
path = "src/lib.rs"

[[bin]]
name = "app-cli"
path = "src/main.rs"

# R01 验收 fixture：可控进程树（tests/tree_lifecycle.rs 真实编排链反例用）
[[bin]]
name = "tree-fixture"
path = "tests/fixtures/tree_fixture.rs"

[dependencies]
# 极轻量 manifest 类型（path 到同仓库的独立小 crate）
workspace-manifest = { workspace = true }
# 受管进程树与信号工具；内部使用 process-wrap 管理 Unix 进程组 / Windows Job Object，
# app-cli 通过此共享层调用，不另行声明 process-wrap。
process_utils = { path = "../process_utils" }
runtime-supervisor = { path = "../runtime-supervisor" }
async-trait = { workspace = true }
# 跨进程 wire 契约（日志域 DTO 单一事实源；rcoder 文档 schema 同源派生）
shared_types = { workspace = true }
userapp-log-reader = { workspace = true }
# 运行态状态根解析契约（R09：与 file-server 同一解析规则；独立 crate 两边共用）
runtime-state-layout = { path = "../runtime-state-layout" }
# pingap 官方配置类型（crates.io 正式发布版：0.13.x 时代的发布 bug 已随 0.15/0.16
# 修复，不再需要 git rev pin；0.16.1 必须与 app-runtime-base 镜像里的 pingap
# 二进制 0.16.x 联动升级，避免 config schema 漂移）
pingap-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json"] }
tracing-appender = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
tokio = { workspace = true }
# server 主循环的编排取消令牌（热部署切换/容器停服级联）
# workspace 版额外带 compat/time 特性（其他成员需要，对本 crate 无害）
tokio-util = { workspace = true }
hyper = { workspace = true }
# workspace 版额外带 server/server-auto 特性；service 为本 crate 增补
hyper-util = { workspace = true, features = ["service"] }
axum = { workspace = true }
# 请求路径百分号解码：按字节解析的成熟实现（手写下标切片在原始多字节
# request-target 上会 panic，见 services::percent_decode_path）
percent-encoding = { workspace = true }
utoipa = { workspace = true }
# 仅本 crate 消费，未入 workspace.dependencies
glob = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
# 对齐 rcoder workspace 的 reqwest 特性集（rustls 固化 + stream 供部署段流式下载）；
# workspace 特性集（json/query/multipart 增补）为原本地 5 特性的超集
reqwest = { workspace = true }
semver = { workspace = true }
# supervisord XML-RPC 响应解析（服务托管引擎）；仅本 crate 消费
roxmltree = { workspace = true }
# Pingap admin 鉴权头：sha256("{user}:{pass}:{ts}")（pingap plugin/admin.rs 算法，非 Basic Auth）
sha2 = { workspace = true }
hex = { workspace = true }
# 部署段解压制品包（deflate 足够覆盖平台制品）
zip = { workspace = true }
# 部署段制品 zip 魔数校验（拦 HTTP 200 + 错误信封 body 被当 zip 落盘）；
# 关 default 裁掉 cfb 传递依赖——只用 archive::is_zip 纯函数；仅本 crate 消费
infer = { workspace = true }

tempfile = { workspace = true }

# 仅测试 fixture（tests/fixtures/tree_fixture.rs）安装 SIGTERM 忽略用；
# 生产代码不直接依赖（传递依赖树中已存在）
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true }

[lints]
workspace = true


[dev-dependencies]
# idle/api 路由行为测试：axum Router oneshot（axum 不 re-export ServiceExt）
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
