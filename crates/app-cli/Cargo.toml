[package]
name = "app-cli"
version = "0.3.11"
edition = "2024"
license = "Apache-2.0"
description = "Cross-platform UserApp build and service manager with orchestration, Pingap routing, and a management API"
# app-cli 独立于 rcoder workspace（exclude）—— 避免 pingap-config 的 bollard/regex 传递依赖
# 与 rcoder workspace 的锁冲突。app-cli 有自己的 Cargo.lock。

[lib]
name = "app_cli"
path = "src/lib.rs"

[[bin]]
name = "app-cli"
path = "src/main.rs"

# R01 验收 fixture：可控进程树（tests/tree_lifecycle.rs 真实编排链反例用）
[[bin]]
name = "tree-fixture"
path = "tests/fixtures/tree_fixture.rs"

[dependencies]
# 极轻量 manifest 类型（path 到同仓库的独立小 crate）
workspace-manifest = { path = "../workspace-manifest" }
# 受管进程树与信号工具；内部使用 process-wrap 管理 Unix 进程组 / Windows Job Object，
# app-cli 通过此共享层调用，不另行声明 process-wrap。
process_utils = { path = "../process_utils" }
runtime-supervisor = { path = "../runtime-supervisor" }
async-trait = "0.1"
# 跨进程 wire 契约（日志域 DTO 单一事实源；rcoder 文档 schema 同源派生）
shared_types = { path = "../shared_types" }
# 运行态状态根解析契约（R09：与 file-server 同一解析规则；独立 crate 两边共用）
runtime-state-layout = { path = "../runtime-state-layout" }
# pingap 官方配置类型（pin 到 v0.14.3 tag commit：crates.io 0.13.x 有发布 bug，用 git rev；
# 与 app-runtime-base 镜像里的 pingap 二进制版本保持一致，避免 config schema 漂移）
# bollard/regex 隔离在 app-cli 自己的 Cargo.lock，不和 rcoder 冲突
pingap-config = { git = "https://github.com/vicanso/pingap", rev = "cd74a461a3e778ae83f7c4dd7fd03ea483f3e3e8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2"
notify = "8"
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
tokio = { version = "1", features = ["full"] }
# server 主循环的编排取消令牌（热部署切换/容器停服级联）
tokio-util = "0.7"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
axum = "0.8"
utoipa = { version = "6", features = ["axum_extras"] }
globset = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
# 对齐 rcoder workspace 的 reqwest 特性集（rustls 固化 + stream 供部署段流式下载）
reqwest = { version = "0.13", default-features = false, features = [
    "stream",
    "rustls",
    "charset",
    "http2",
    "system-proxy",
] }
semver = "1"
# supervisord XML-RPC 响应解析（服务托管引擎）
roxmltree = "0.21"
# Pingap admin 鉴权头：sha256("{user}:{pass}:{ts}")（pingap plugin/admin.rs 算法，非 Basic Auth）
sha2 = "0.11"
hex = "0.4"
# 部署段解压制品包（与 rcoder workspace zip 同版本；deflate 足够覆盖平台制品）
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# 部署段制品 zip 魔数校验（拦 HTTP 200 + 错误信封 body 被当 zip 落盘）；
# 关 default 裁掉 cfb 传递依赖——只用 archive::is_zip 纯函数
infer = { version = "0.22", default-features = false }

tempfile = "3"

# 仅测试 fixture（tests/fixtures/tree_fixture.rs）安装 SIGTERM 忽略用；
# 生产代码不直接依赖（传递依赖树中已存在）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[lints]
workspace = true


[dev-dependencies]
# idle/api 路由行为测试：axum Router oneshot（axum 不 re-export ServiceExt）
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace.lints]
# 与主 workspace 同款红线：生产代码禁 unsafe。测试模块的 env 变异
#（set_var/remove_var 在 edition 2024 为 unsafe）经 lib.rs 的 cfg(test)
# allow 豁免——仅测试代码、仅 env 变异，不含其他 unsafe 操作。
rust.unsafe_code = "deny"
