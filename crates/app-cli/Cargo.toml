[package]
name = "app-cli"
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
description = "UserApp 容器运行时编排器（替代 start.sh，管 pingap + 子项目编排 + 管理 API）"
# app-cli 独立于 rcoder workspace（exclude）—— 避免 pingap-config 的 bollard/regex 传递依赖
# 与 rcoder workspace 的锁冲突。app-cli 有自己的 Cargo.lock。

[lib]
name = "app_cli"
path = "src/lib.rs"

[[bin]]
name = "app-cli"
path = "src/main.rs"

[dependencies]
# 极轻量 manifest 类型（path 到同仓库的独立小 crate）
workspace-manifest = { path = "../workspace-manifest" }
# unix 进程组信号工具（含 PID 1 防御，与 rcoder workspace 共用同一实现）
process_utils = { path = "../process_utils" }
# pingap 官方配置类型（pin 到 v0.13.8 tag commit：crates.io 0.13.x 有发布 bug，用 git rev；
# 与 app-runtime-base 镜像里的 pingap 二进制版本保持一致，避免 config schema 漂移）
# bollard/regex 隔离在 app-cli 自己的 Cargo.lock，不和 rcoder 冲突
pingap-config = { git = "https://github.com/vicanso/pingap", rev = "07d1cce1b658418bb46c2dec1a49c43fd2f48268" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
notify = "8"
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
utoipa = { version = "5", features = ["axum_extras"] }
globset = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false }
semver = "1"

# unix 信号已通过 process_utils 封装（仅 unix 启用，不污染 windows 构建）

[dev-dependencies]
tempfile = "3"
