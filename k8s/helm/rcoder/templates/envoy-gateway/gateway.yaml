{{- if and .Values.gateway.enabled .Values.envoyGateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rcoder-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rcoder.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Release.Namespace }}-rcoder-gateway-class
  listeners:
    - name: http
      port: {{ .Values.envoyGateway.listenerPort }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
