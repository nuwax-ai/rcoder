{{- if and .Values.gateway.enabled .Values.envoyGateway.enabled }}
# SSE 流式传输策略
#
# 禁用 requestTimeout 和 maxStreamDuration，支持长连接 SSE 流。
# Envoy 不会主动断开下游连接，由 agent_runner 控制流的生命周期。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: rcoder-streaming-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rcoder.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rcoder-agent-catch-all
  timeout:
    http:
      requestTimeout: 0s
  connection:
    bufferLimit: "20Mi"
  tcpKeepalive:
    probes: 3
    idleTime: 60s
    interval: 30s
{{- end }}
