# ClusterRoleBinding：仅 RCoder 主服务拥有编排权限，租户不能修改 Pod 标签或读取 Secret。
# 单文档（见 rbac.yaml 顶部说明）。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rcoder-role-binding
subjects:
  - kind: ServiceAccount
    name: rcoder-sa
    namespace: rcoder-dev
roleRef:
  kind: ClusterRole
  name: rcoder-role
  apiGroup: rbac.authorization.k8s.io
