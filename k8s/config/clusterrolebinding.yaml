# ClusterRoleBinding：把 rcoder-role 绑定到两个 ServiceAccount。
# 单文档（见 rbac.yaml 顶部说明）。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rcoder-role-binding
subjects:
  - kind: ServiceAccount
    name: rcoder-sa
    namespace: rcoder-dev
  - kind: ServiceAccount
    name: rcoder-pods-sa
    namespace: rcoder-dev
roleRef:
  kind: ClusterRole
  name: rcoder-role
  apiGroup: rbac.authorization.k8s.io
