# ClusterRole：rcoder 主 SA 与 app Pod SA 共用的集群级权限。
#
# 单文档（每文件单资源，兼容单文档 YAML 解析器，与同目录 deployment.yaml / pvc.yaml /
# service.yaml / serviceaccount.yaml 的"一文件一资源"风格一致）。
#   - ServiceAccount 见 serviceaccount.yaml (rcoder-pods-sa) / serviceaccount-rcoder.yaml (rcoder-sa)
#   - 绑定见 clusterrolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rcoder-role
rules:
  - apiGroups: [""]
    resources:
      ["pods", "pods/log", "pods/exec", "services", "endpoints", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # UserApp HTTPRoute（app_manager，经 Gateway；SSA apply 需 patch/update）
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["create", "delete", "deletecollection", "get", "list", "watch", "patch", "update"]
  # UserApp env ConfigMap / 敏感变量 Secret（app_manager；SSA apply 需 patch/update）
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create", "delete", "deletecollection", "get", "list", "watch", "patch", "update"]
