apiVersion: v1
kind: ServiceAccount
metadata:
  name: rcoder-sa
  namespace: rcoder-dev

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rcoder-pods-sa
  namespace: rcoder-dev

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rcoder-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "endpoints", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # UserApp HTTPRoute（app_manager，经 Gateway）
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["create", "delete", "deletecollection", "get", "list", "watch"]
  # UserApp env ConfigMap / 敏感变量 Secret（app_manager）
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create", "delete", "deletecollection", "get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rcoder-role-binding
subjects:
  - kind: ServiceAccount
    name: rcoder-sa
    namespace: rcoder-dev
  - kind: ServiceAccount
    name: rcoder-pods-sa
    namespace: rcoder-dev
roleRef:
  kind: ClusterRole
  name: rcoder-role
  apiGroup: rbac.authorization.k8s.io
