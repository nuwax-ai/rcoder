# ClusterRole：仅 rcoder 主 SA 使用的集群编排权限，不能绑定租户 app Pod SA。
#
# 单文档（每文件单资源，兼容单文档 YAML 解析器，与同目录 deployment.yaml / pvc.yaml /
# service.yaml / serviceaccount.yaml 的"一文件一资源"风格一致）。
#   - ServiceAccount 见 serviceaccount.yaml (rcoder-pods-sa) / serviceaccount-rcoder.yaml (rcoder-sa)
#   - 绑定见 clusterrolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rcoder-role
rules:
  - apiGroups: [""]
    resources:
      ["pods", "pods/log", "pods/exec", "services", "endpoints", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  # persistentvolumes: 读 PV csi.volumeAttributes.subvolumePath(阶段2 rcoder 挂根聚合访问 agent subvolume)
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # UserApp HTTPRoute（app_manager，经 Gateway；SSA apply 需 patch/update）
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["create", "delete", "deletecollection", "get", "list", "watch", "patch", "update"]
  # UserApp env ConfigMap / 敏感变量 Secret（app_manager；SSA apply 需 patch/update）
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create", "delete", "deletecollection", "get", "list", "watch", "patch", "update"]
  # kube-runtime Event publisher（批次 C）：诊断事件仅 create/patch，最小授权
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # 操作互斥租约（docker_manager k8s_app_operation：acquire/renew/接管/release）
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "watch", "patch", "update"]
