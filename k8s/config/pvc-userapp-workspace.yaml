# UserApp 开发共享卷（沙箱 /home/user/userapp-workspace 与 builder /app/userapp-workspace 同卷，
# 目录结构 {app_id}/）。名称须与 rcoder env RCODER_USERAPP_WORKSPACE_PVC_NAME 一致
# （deployment.yaml 注入）。单文档（见 rbac.yaml 顶部说明）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: userapp-workspace-pvc
spec:
  accessModes:
    - ReadWriteOnce        # 本地 local-path 只支持 RWO；orbstack 单节点，多 pod 同节点共享等同 RWX
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
