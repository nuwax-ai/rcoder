# cargo 构建缓存卷（rcoder 容器 /app/target 持久化，加速增量编译）。
# 单文档（见 rbac.yaml 顶部说明）。app 工作空间卷见 pvc-workspace.yaml。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cargo-target-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
