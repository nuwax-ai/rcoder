apiVersion: apps/v1
kind: Deployment
metadata:
  name: rcoder
  labels:
    app: rcoder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rcoder
  template:
    metadata:
      labels:
        app: rcoder
    spec:
      serviceAccountName: rcoder-sa
      containers:
        - name: rcoder
          image: dev-master-rcoder-devspace:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/app/devspace_start.sh"]
          ports:
            - containerPort: 8290
              name: http
            - containerPort: 8088
              name: pingora
            - containerPort: 7681
              name: ttyd
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: DOCKER_SOCKET_PATH
              value: "/var/run/docker.sock"
            - name: ENABLE_TTYD
              value: "false"
            - name: CONTAINER_RUNTIME
              value: "kubernetes"
            - name: RCODER_K8S_NAMESPACE
              value: "rcoder-dev"
            - name: RCODER_K8S_STORAGE_CLASS
              value: "local-path"
            - name: RCODER_K8S_PVC_ACCESS_MODE
              value: "ReadWriteOnce"
            # app_manager（UserApp）共享存储：复用 project-workspace PVC（devspace 命名），
            # app Pod 挂其 workspace/apps/{app_id} subPath → /app；rcoder 无 subPath 挂载
            # （/app/project_workspace = PVC 根），故 workspace_root 多一层 workspace
            - name: RCODER_WORKSPACE_PVC_NAME
              value: "project-workspace-pvc"
            - name: RCODER_WORKSPACE_ROOT
              value: "/app/project_workspace/workspace/apps"
            # UserApp HTTP 端口经 Gateway（HTTPRoute）。本地 devspace 无真实 gateway 时
            # HTTPRoute 创建会成功但 ResolvedRefs=False；TCP/存储/生命周期验证不受影响。
            - name: RCODER_K8S_GATEWAY_NAME
              value: "nuwax-gateway"
            - name: RCODER_K8S_GATEWAY_NAMESPACE
              value: "default"
          volumeMounts:
            - name: cargo-target
              mountPath: /app/target
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: project-workspace
              mountPath: /app/project_workspace
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: cargo-target
          persistentVolumeClaim:
            claimName: cargo-target-pvc
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: project-workspace
          persistentVolumeClaim:
            claimName: project-workspace-pvc
        - name: logs
          emptyDir: {}
