apiVersion: 1

# Tempo 分布式追踪数据源（App → otel-collector → Tempo）
# Explore → Tempo：按 service.name / trace_id 检索，自带 Flame graph 与瀑布视图
# 注：tracesToMetrics 联动（跳 Prometheus 查耗时直方图）需 datasource 先就绪，
# provisioning 校验时序不满足会启动失败——按需在 Grafana UI 手动配置
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      httpMethod: GET
