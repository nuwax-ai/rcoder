apiVersion: 1

# Tempo 分布式追踪数据源（App → otel-collector → Tempo）
# Explore → Tempo：按 service.name / trace_id 检索，自带 Flame graph 与瀑布视图
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      httpMethod: GET
      # trace → metrics 联动（点 span 跳 Prometheus 查耗时直方图）
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service
