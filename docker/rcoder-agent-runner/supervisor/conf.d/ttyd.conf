# ttyd（Web 终端；不依赖 X11，前台 exec start-ttyd.sh）
[program:ttyd]
command=/usr/local/bin/start-ttyd.sh
priority=30
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/app/logs/ttyd.out.log
stderr_logfile=/app/logs/ttyd.err.log
environment=TTYD_PORT="%(ENV_TTYD_PORT)s",TTYD_USER="user",TTYD_INDEX="/usr/local/share/ttyd/index.html"
