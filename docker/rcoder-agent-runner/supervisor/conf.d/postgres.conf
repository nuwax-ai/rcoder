# PostgreSQL 16（开发本地数据库；首次 initdb 由 pg-supervisor-entry.sh 幂等完成,
# 异步于 agent_runner —— initdb 慢只推迟 PG 可用, 不阻塞 :8086 health）
[program:postgresql]
command=/usr/local/bin/pg-supervisor-entry.sh
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/app/logs/pg.out.log
stderr_logfile=/app/logs/pg.err.log
environment=PGDATA="%(ENV_PGDATA)s"
