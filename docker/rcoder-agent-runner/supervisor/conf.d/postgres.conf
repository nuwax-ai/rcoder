# PostgreSQL 16（开发本地数据库；PGDATA 由 start-up.sh 的 init_pg 首次初始化）
[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D %(ENV_PGDATA)s
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/app/logs/pg.out.log
stderr_logfile=/app/logs/pg.err.log
environment=PGDATA="%(ENV_PGDATA)s"
