# dbx-web(DBX 数据库 Web GUI,60+ 数据库;桌面 DBX 图标 chromium 打开 http://localhost:4224)
# 无 CLI 参数,全 env 配置(DBX_PORT/DBX_STATIC_DIR/DBX_DATA_DIR 继承 start-up.sh prepare_pg 导出的环境)。
# 面板免登(DBX_DISABLE_PASSWORD=1,内网容器语义);local-pg 预置连接由 fork dbx
# 启动自管(local_pg.rs:unix socket 免密直连,凭据不落盘,与 PG 密码解耦)。
[program:dbx]
command=/usr/local/bin/dbx-web
environment=DBX_DISABLE_PASSWORD="1"
priority=25
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/app/logs/dbx.out.log
stderr_logfile=/app/logs/dbx.err.log
