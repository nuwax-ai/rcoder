name: rcoder
services:
  rcoder:
    image: ${RCODER_IMAGE:-dev-master-rcoder:latest}
    ports:
      - "${RCODER_PORT:-8090}:${RCODER_PORT:-8090}"
      - "8089:8088" # Pingora 反向代理端口（VNC 代理、健康检查等）
      - "6669:6669" # tokio-console 观测（make console-on 运行期启用）
      - "8199:80"
      - "60000:60000" # file-server 分流代理入口（all_rust → 主端口; K8s 形态同构缩小版）
      - "7681:7681" # ttyd Web 终端端口
    environment:
      - TZ=Asia/Shanghai
      - RCODER_PORT=${RCODER_PORT:-8090}
      - RUST_LOG=debug,bollard=info,h2=info,hyper=info,tonic=info # debug 基线 + 收敛三方库噪声（bollard 全量 inspect JSON dump / h2 帧日志）
      # tokio-console 运行期开关（console feature 恒编入 binary；仅 DEV_CONSOLE=1 时
      # 注入 ConsoleLayer + EnvFilter 放行 tokio/runtime trace）。默认关：console-
      # subscriber 对 tokio 微观事件无背压记账，rcoder 后台事件量下 RSS 数十 MB/s
      # 爬升直至 OOM——用时 `make console-on`，用完 `make console-off`
      - DEV_CONSOLE=${DEV_CONSOLE:-0}
      # console 开启时的已完成任务保留窗口（Aggregator 表内存 = 最近 N 分钟记录量；
      # 库默认 1h 在本进程事件速率下必然 OOM，5 分钟是观测价值与内存的平衡点）
      - TOKIO_CONSOLE_RETENTION=${TOKIO_CONSOLE_RETENTION:-300}
      # console layer 是 per-layer filter，但静态 level hint 需要全局放行
      # app_manager（UserApp）Docker 模式工作空间根（app-workspace 挂在 /app/app-workspace）；
      # 不设则默认 /app/project_workspace/apps，与挂载点不符，文件管理/storage 会路径错
      - RCODER_WORKSPACE_ROOT=/app/app-workspace
      # file-server 路由已常驻合并进主服务（主端口可达，无独立 60000 listener）；
      # RCODER_EMBED_FILE_SERVER 仅 agent_runner 进程消费，rcoder 进程不再读取
      # UserApp release.lock 构建元数据；测试正式镜像时建议由 shell 覆盖 digest。
      - RCODER_PINGAP_VERSION=${RCODER_PINGAP_VERSION:-0.13.8}
      - RCODER_PINGAP_COMMIT=${RCODER_PINGAP_COMMIT:-07d1cce1b658418bb46c2dec1a49c43fd2f48268}
      - RCODER_RUNTIME_IMAGE_DIGEST=${RCODER_RUNTIME_IMAGE_DIGEST:-nuwax-docker-images-registry.cn-hangzhou.cr.aliyuncs.com/nuwax-test/app-runtime:0.1.186-arm64}
      # 🎯 关键：获取docker sock,用于检测宿主机路径
      - DOCKER_SOCKET_PATH=${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
      # 主容器禁用 ttyd（ttyd 在动态创建的容器中运行）
      - ENABLE_TTYD=false
      # OTLP 分布式追踪（与生产同拓扑：App → otel-collector → Tempo；service.name 自动=rcoder）
      # Grafana Explore → Tempo 查看 trace（火焰图/瀑布），trace_id 与 JSON 日志一致
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      # 挂载 Docker socket
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # 🎯 挂载本地测试配置文件（使用与主容器相同的镜像）
      - ./config.yml:/app/config.yml
      # 挂载项目工作目录 - 这是关键的挂载！
      - ./project_workspace:/app/project_workspace
      # 挂载 computer 项目工作目录
      - ./computer-project-workspace:/app/computer-project-workspace
      # UserApp 开发卷锚点（Docker 模式）：per-app bind 的宿主路径反解依据
      # （user-app-builder 段 workspace_resolution_path=/app/userapp-workspace）；
      # 宿主树 dev/{user_id}/{app_id} + data/{app_id} + logs/{app_id} + agent-store/{app_id}
      # 四目录分别 bind → 容器 /home/user/{app_id} + /home/user/data + /home/user/logs +
      # /home/user/.agent-store（挂载压平：env/user 层只在宿主树）；prod/{user_id}/data/{app_id}
      # bind → UserApp 运行容器 /home/user/{app_id}（PG/dbx 持久数据与发布卷解耦）
      - ./userapp-workspace:/app/userapp-workspace
      # 挂载工作目录
      - ./logs/:/app/logs
      # 挂载启动脚本
      - ./start-rcoder.sh:/app/start-rcoder.sh
      # 挂载项目模板 (create-project 用, react/vue3 vite 模板 zip)
      - ./project_init:/app/project_init
      # 专门用于npm,pnpm,bun,uvx 缓存使用的目录
      - ./computer-cache:/root/.cache
      # 应用管理工作空间目录
      - ./app-workspace:/app/app-workspace
      # 🖼️ 挂载壁纸目录（供 agent_runner 子容器使用）
      # - ./wallpaper:/app/assets
      # ============ 容器内热编译（本地开发测试用，见 make dev-hot）============
      # 仓库源码 → /app/src（dev-master-rcoder 镜像只含 binary，热编译需源码）
      - ..:/app/src:cached
      # cargo 依赖缓存（跨容器持久化，避免每次 dev-restart 后重下）
      - rcoder-cargo-registry:/root/.cargo/registry
      - rcoder-cargo-git:/root/.cargo/git
      # cargo target 缓存（独立 volume，避免 bind mount 拖慢 target 小文件 IO）
      - rcoder-target:/app/src/target
      # tokio-console 观测构建的独立 target（RUSTFLAGS 指纹隔离，见 dev-hot-build.sh）
      - rcoder-target-console:/app/src/target-console
    command: ["/bin/bash", "/app/start-rcoder.sh"]
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${RCODER_PORT:-8090}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

  # TS nuwax-file-server——60000 分流代理的存量域上游（ts_first/userapp_split 验证用）。
  # 与 rcoder 共享网络栈（network_mode）：proxy lib 的 TS 上游固定 127.0.0.1:60001，
  # 生产形态二者同容器（start-services.sh），本地以此等价模拟。
  # npm 装进 named volume，容器重启不重装；版本与 npm 包 @nuwax-ai/file-server-proxy
  # 的精确 pin 同源（1.4.2）。
  nuwax-file-server:
    image: node:22-bookworm-slim
    network_mode: "service:rcoder"
    restart: unless-stopped
    environment:
      - PORT=60001
      - NODE_ENV=production
    working_dir: /opt/ts
    volumes:
      - rcoder-ts-npm:/opt/ts
    command: >
      sh -c "if [ ! -d node_modules/nuwax-file-server ];
             then npm install nuwax-file-server@1.4.2 --no-fund --no-audit; fi &&
             exec node node_modules/nuwax-file-server/dist/server.js"

  # Pyroscope Server - 持续剖析数据存储和可视化
  pyroscope:
    image: grafana/pyroscope:latest
    container_name: rcoder-pyroscope
    ports:
      - "4040:4040" # Web UI
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - pyroscope-data:/data
    command:
      - server
    restart: unless-stopped

  # Tempo - 分布式追踪后端（OTLP traces 存储；配置见 docker/tempo/tempo.yml）
  # 钉 2.9.0：3.x 移除 ingester/compactor 配置块（schema 大改），
  # 生产升级 3.x 时用官方转换器 tempo config converter 迁移
  tempo:
    image: grafana/tempo:2.9.0
    container_name: rcoder-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200" # 查询 API（Grafana 数据源走容器网络，宿主映射供调试）
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  # otel-collector - 遥测收集管道（与生产同拓扑：App → Collector → 后端）
  # 价值：后端解耦/缓冲重试/探活噪声过滤；自身指标 :8888（Prometheus 抓取，丢数排障抓手）
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: rcoder-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317" # OTLP gRPC（rcoder/agent 容器经服务名访问；宿主映射供调试）
      - "4318:4318" # OTLP HTTP
      - "8888:8888" # collector 自身指标
    volumes:
      - ./otel-collector/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  # Prometheus Server - 时序数据库，存储常规指标
  prometheus:
    image: prom/prometheus:latest
    container_name: rcoder-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9091:9090" # 宿主机 9091 → 容器 9090（避免端口冲突）
    volumes:
      # 目录级挂载：单文件挂载在宿主编辑（inode 替换）后会断链
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  # Grafana - 可视化平台
  grafana:
    image: grafana/grafana:latest
    container_name: rcoder-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=Asia/Shanghai
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  pyroscope-data:
  tempo-data:
  prometheus-data:
  grafana-data:
  # 容器内热编译缓存（本地开发测试用）
  rcoder-cargo-registry:
  rcoder-cargo-git:
  rcoder-target:
  rcoder-target-console:
  # TS nuwax-file-server 的 node_modules 缓存（容器重启不重装）
  rcoder-ts-npm:
