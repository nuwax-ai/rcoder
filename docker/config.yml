# RCoder 本地 Docker 容器测试配置
# 用于在 docker-compose 启动的容器中测试动态启动子容器

# 默认使用的 AI 代理类型 (Claude/Codex)
default_agent: "Claude"

# 项目工作目录
projects_dir: "/app/project_workspace"

# 主服务端口（会被环境变量 RCODER_PORT 覆盖）
port: 8090

# 容器清理配置
cleanup_config:
  # 是否启用容器清理功能（默认禁用）
  # 设置为 true 可以启用自动清理闲置容器
  # - true: 启用（自动清理闲置容器）
  # - false: 禁用（默认，更安全）
  enabled: true
  # 闲置超时时间（秒），超过此时间未活动的容器将被清理
  # 默认值: 600 (10分钟)
  idle_timeout_seconds: 600
  # 清理任务执行间隔（秒）
  # 默认值: 300 (5分钟)
  cleanup_interval_seconds: 500
  # Docker 容器停止超时时间（秒）
  # 默认值: 30
  docker_stop_timeout_seconds: 30
  # 容器最小保护时间（秒），刚启动的容器在此时间内不会被清理
  # 默认值: 300 (5分钟)
  container_protection_seconds: 300

# 60000 file-server 分流代理（本地 dev 形态：默认 all_rust 全走本服务主端口 8090；
# TS nuwax-file-server 已由 compose 的 nuwax-file-server 服务（共享网络栈）提供
# 127.0.0.1:60001，可切 userapp_split/ts_first/all_ts 验证分流——
# ts_first=仅 /api/userapp*→8090，存量同名接口（含 x-service-type 标记）全走 TS）
file_server_proxy:
  listen_port: 60000
  rust_upstream_port: 8090
  ts_upstream_port: 60001
  policy: all_rust

# Pingora 反向代理配置
proxy_config:
  listen_port: 8088
  default_backend_port: 8090
  backend_host: "127.0.0.1"
  port_param: "port"
  health_check:
    enabled: true
    interval_seconds: 5
    timeout_seconds: 1
    healthy_threshold: 2
    unhealthy_threshold: 3

# Docker 配置
docker_config:
  # 多镜像配置系统
  multi_image_config:
    # 全局默认配置
    global_defaults:
      registry_prefix: "nuwax-docker-images-registry.cn-hangzhou.cr.aliyuncs.com/dev"

    # 服务镜像配置
    services:
      # RCoder 主服务配置（使用与主容器相同的镜像）
      web-agent-runner:
        service_type: "web-agent-runner"
        # 🎯 使用本地构建的镜像（包含 agent-runner-start.sh 脚本）
        image: "dev-master-rcoder:latest"
        arm64_image: "dev-master-rcoder:latest"
        amd64_image: "dev-master-rcoder:latest"
        default_image: "dev-master-rcoder:latest"
        image_tag_prefix: "dev-master-rcoder"
        enabled: true

        # rcoder 容器内用于反向解析宿主机路径的基准路径
        workspace_resolution_path: "/app/project_workspace"

        environment:
          RUST_LOG: "debug"
          SERVICE_MODE: "full"
          API_PORT: "8086"
          PROJECT_WORKSPACE_BASE: "/app/project_workspace"
          # OTLP 分布式追踪（App → otel-collector → Tempo；K8s 由 kubernetes_config.environment 同名覆盖）
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
        command:
          - "/bin/bash"
          - "/app/agent-runner-start.sh"
          - "/app/bin/agent_runner"
          - "--port"
          - "8086"

        resource_limits:
          memory_limit: 2147483648 # 2GB
          cpu_limit: 2.0
          swap_limit: 4294967296 # 4GB

        work_dir: "/app"
        network_mode: "bridge"

        # 🎯 主挂载：项目工作目录
        # 宿主机: /project_workspace/{project_id} → 容器: /app/project_workspace/{project_id}
        # 注意：当 pod_id 存在时，会根据 isolation_type 动态调整挂载路径
        #   - space: /app/project_workspace/{tenant_id}/{space_id}
        #   - tenant: /app/project_workspace/{tenant_id}
        #   - project: /app/project_workspace/{tenant_id}/{space_id}/{project_id}
        mounts:
          # - container_path: "/app/project_workspace/{project_id}"
          #   host_path: "{resolved_path}/{project_id}"
          #   read_only: false
          #   mount_type: "bind"
          #   resolve_from: "/app/project_workspace"
          # 动态挂载：日志目录 (使用变量替换)
          # resolve_from: 指定从哪个容器内路径解析宿主机基础路径
          # {resolved_path}: 解析后的宿主机基础路径
          # {log_dir_name}: 日志目录名（container_name-timestamp）
          - container_path: "/app/logs"
            host_path: "{resolved_path}/page-logs/{log_dir_name}"
            read_only: false
            mount_type: "bind"
            resolve_from: "/app/logs"
      # ComputerAgentRunner 服务配置
      computer-agent-runner:
        service_type: "computer-agent-runner"
        # 🎯 使用本地构建的镜像（make docker-build-agent-runner 构建）
        image: "dev-rcoder-agent-runner:latest"
        arm64_image: "dev-rcoder-agent-runner:latest"
        amd64_image: "dev-rcoder-agent-runner:latest"
        default_image: "dev-rcoder-agent-runner:latest"
        image_tag_prefix: "dev-rcoder-agent-runner"
        enabled: true

        # rcoder 容器内用于反向解析宿主机路径的基准路径
        workspace_resolution_path: "/app/computer-project-workspace"

        environment:
          RUST_LOG: "debug"
          SERVICE_MODE: "agent-only"
          AGENT_PORT: "8086"
          PROJECT_WORKSPACE_BASE: "/home/user"
          # 🔥 Agent 清理配置（闲置超时时间，秒）
          # 默认值: 3600 (1小时)
          RCODER_AGENT_IDLE_TIMEOUT_SECS: "3600"
          # OTLP 分布式追踪（App → otel-collector → Tempo；K8s 由 kubernetes_config.environment 同名覆盖）
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
          # 🖼️ 自定义壁纸配置
          # 通过挂载的 /app/assets 目录使用宿主机壁纸
          # 使用方法：在宿主机 ./wallpaper 目录放置 wallpaper.jpeg
          # CUSTOM_WALLPAPER_PATH: "/app/assets/wallpaper.jpeg"

        command:
          - "/usr/local/bin/agent_runner"
          - "--port"
          - "8086"

        resource_limits:
          memory_limit: 4294967296 # 4GB
          cpu_limit: 2.0
          swap_limit: 8589934592 # 8GB

        # 可选：Docker 模式子容器安全参数（仅 Docker 部署生效；老内核 EPERM 时启用，运维自负其责）
        # 未配置（保持注释）时走代码默认：privileged=false + cap_drop=[NET_RAW,NET_ADMIN]。
        # 一旦配置则整体覆盖默认；字段语义与 docker-compose.yml 的 security_opt 一致，可直接照搬。
        # security:
        #   security_opt:
        #     - "seccomp=unconfined"      # 关闭 seccomp（老内核兼容）
        #     - "apparmor=unconfined"     # 关闭 apparmor
        #   cap_add:
        #     - "SYS_PTRACE"              # chrome sandbox 常需要
        #   # privileged: true            # 极端情况才开，会移除几乎所有内核限制
        #   # pids_limit: 200             # 进程数上限（0/-1 表示无限制）
        #   # init: true                  # 容器内运行 init 进程（转发信号 + 回收僵尸）

        work_dir: "/app"
        network_mode: "bridge"

        mounts:
          # 🎯 主挂载：用户主目录（持久化 VNC 桌面数据）
          # 宿主机: /computer-project-workspace/{user_id} → 容器: /home/user
          - container_path: "/home/user"
            host_path: "{resolved_path}/{user_id}"
            read_only: false
            mount_type: "bind"
            resolve_from: "/app/computer-project-workspace"
          # 动态挂载：日志目录 (使用变量替换)
          # resolve_from: 指定从哪个容器内路径解析宿主机基础路径
          # {resolved_path}: 解析后的宿主机基础路径
          # {log_dir_name}: 日志目录名（container_name-timestamp）
          # 🔥 panic 日志也会写入此目录 (agent_runner_panic.log)
          - container_path: "/app/container-logs"
            host_path: "{resolved_path}/{log_dir_name}"
            read_only: false
            mount_type: "bind"
            resolve_from: "/app/logs/container"
          # 🖼️ 自定义壁纸挂载
          # 将宿主机 ./wallpaper 目录挂载到容器内
          # rcoder 主服务已将 wallpaper 挂载到 /app/assets
          - container_path: "/app/assets"
            host_path: "{resolved_path}"
            read_only: true
            mount_type: "bind"
            resolve_from: "/app/assets"

      # UserAppBuilder 服务配置: per-app 完整开发容器(agent_runner + 内嵌 file-server:60000 + PG 全套)
      # 复用 dev-rcoder-agent-runner 镜像,默认 ENTRYPOINT/start-up.sh 启动(不设 command);
      # 容器名 rcoder-app-builder-{app_id},K8s per-app RWO PVC / Docker per-app bind。
      # workspace_resolution_path = Docker 模式宿主路径反解锚点(compose 挂载 ./userapp-workspace
      # → /app/userapp-workspace);容器内挂载点用镜像默认 /home/user/userapp-workspace
      # (不覆盖 USERAPP_WORKSPACE_DIR/PROJECT_SOURCE_DIR/PROJECT_WORKSPACE_BASE)。
      # K8s 完整 env 在 build-agent-docker chart。
      user-app-builder:
        service_type: "user-app-builder"
        image: "dev-rcoder-agent-runner:latest"
        arm64_image: "dev-rcoder-agent-runner:latest"
        amd64_image: "dev-rcoder-agent-runner:latest"
        default_image: "dev-rcoder-agent-runner:latest"
        image_tag_prefix: "rcoder-app-builder"
        enabled: true
        workspace_resolution_path: "/app/userapp-workspace"
        environment:
          RUST_LOG: "debug"
          # agent_runner 进程读此 flag 启内嵌 file-server(build/文件接口入口 :60000)
          RCODER_EMBED_FILE_SERVER: "true"
          # release lock 构建身份三元组（build 产 workspace-package 的 release.lock.toml 需要；
          # 与 K8s 模式 env 透传、rcoder compose env 同源——值由部署环境注入）
          RCODER_PINGAP_VERSION: "0.13.8"
          RCODER_PINGAP_COMMIT: "local-development"
          RCODER_RUNTIME_IMAGE_DIGEST: "sha256:local-development"
        resource_limits:
          memory_limit: 2147483648 # 2GB
          cpu_limit: 2.0
          swap_limit: 4294963648 # 4GB
        work_dir: "/app"
        network_mode: "bridge"
        mounts: []

    # 镜像选择策略
    selection_strategy: "ServiceOnly"

    # 缓存配置
    cache_config:
      enabled: true
      ttl_seconds: 3600
      max_entries: 50

  # 其他 Docker 配置
  network_mode: "bridge"
  # 网络基础名称（不含 project name 前缀）
  # Docker Compose 会自动添加 project name 前缀，实际网络名称为 {project_name}_{network_base_name}
  # 例如: network_base_name="agent-network" 时，实际网络为 "rcoder_agent-network"
  network_base_name: "agent-network"
  work_dir: "/app"
  auto_cleanup: true
  container_ttl_seconds: 3600

# API Key 鉴权配置（可选）
api_key_auth:
  # 是否启用 API Key 鉴权（默认关闭）
  # 启用后，所有 HTTP 请求必须携带正确的 x-api-key header
  # 豁免端点：/health, /metrics, /api/docs, /proxy/status, /proxy/stats
  enabled: false

  # API Key 值（首次生成时自动创建随机密钥）
  # 格式：sk-{32位十六进制字符串}
  # 示例：sk-a1b2c3d4e5f6789012345678abcdef01
  # 可以通过环境变量 RCODER_API_KEY 覆盖此配置
  # 生产环境请务必修改此密钥或使用环境变量
  api_key: "YOUR_API_KEY_HERE_CHANGE_THIS"
