[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:etcd]
command=/usr/local/bin/etcd --config-file /app/config/etcd.conf.yml
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/etcd.log
stderr_logfile=/var/log/supervisor/etcd-error.log
priority=5
startsecs=10
startretries=3

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /app/data/postgresql
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql-error.log
priority=10
startsecs=10
startretries=3

[program:go-app]
command=/app/bin/app
directory=/app
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/go-app.log
stderr_logfile=/var/log/supervisor/go-app-error.log
environment=GONOSUMCHECK="*",GONOSUMDB="*",GOFLAGS="-mod=vendor",DATABASE_URL="postgresql://appuser:apppassword@localhost:5432/appdb",PORT="8080"
priority=20
startsecs=15
startretries=3

[program:node-app]
command=node /app/src/node/server.js
directory=/app/src/node
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/node-app.log
stderr_logfile=/var/log/supervisor/node-app-error.log
environment=NODE_ENV="production",PORT="3000"
priority=30
startsecs=10
startretries=3

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
priority=40
startsecs=5
startretries=3

[group:app]
programs=etcd,postgresql,go-app,node-app,nginx,ttyd
priority=999

[program:ttyd]
command=/usr/local/bin/start-ttyd.sh
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/ttyd.log
stderr_logfile=/var/log/supervisor/ttyd-error.log
priority=50
startsecs=5
startretries=3
