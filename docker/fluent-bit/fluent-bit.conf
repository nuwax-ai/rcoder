# 本地复刻生产日志采集链路（阶段一 B3，生产源: build-agent-docker/k8s/logging/fluent-bit/configmap.yaml）
# 保真边界（与生产逐字段一致的部分直接标注"逐字复制"，两处必要替代见各段注释）:
#   - SERVICE 块: 逐字复制（configmap.yaml:15-30）
#   - INPUT: 生产 tail /var/log/containers/*.log + Parser cri（configmap.yaml:46-57）。
#     本地无 kubelet/容器日志文件 → 改 tail /app/logs/*.log（与 sidecar _log-shipper.tpl:37
#     所 tail 的同一批文件），且不加 Parser：tail 默认把原始行放 log 字段，
#     等价于生产 CRI 解析后的记录形态。
#   - FILTER: 生产 kubernetes FILTER（configmap.yaml:73-87，含 Merge_Log/Keep_Log）→
#     Lua synthesize_k8s_meta 替身（构造同构 record["kubernetes"] map，含 labels，
#     使 Auto_Kubernetes_Labels On 被真实演练）；flatten_k8s_meta 逐字复制；
#     rewrite_tag 5 条规则逐字复制（Match 由 kube.* 改 from-rcoder，本地 ns 走兜底规则）。
#   - OUTPUT: 生产 test 块逐字复制（configmap.yaml:132-144），占位符按 deploy.sh:113-122
#     解析后的最终值填入（Host→loki 容器名，Label_Keys $ns,$pod,$container）。
#   - 镜像版本 3.2.10 = 生产硬下限（CRI 纳秒时间戳兼容，见 deploy.sh:133-134）。

[SERVICE]
    Flush         5
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Health_Check  On
    # ── 缓冲落盘 (根治 OOM): 背压时 chunk 写盘而非吃内存 ──
    # Max_Chunks_Up 24 = 48Mi up-chunks 上限, 按 512Mi limit 反推 (不能用默认 128)
    Storage.Path              /var/lib/fluent-bit/storage
    Storage.Sync              normal
    Storage.Checksum          off
    Storage.Max_Chunks_Up     24
    Storage.Backlog.Mem_Limit 5MB

[INPUT]
    Name              tail
    Tag               from-rcoder
    Path              /app/logs/*.log
    DB                /var/lib/fluent-bit/flb_kube.db
    Mem_Buf_Limit     20MB
    Storage.Type      filesystem
    Storage.pause_on_chunks_overlimit  off
    Skip_Long_Lines   On
    Refresh_Interval  10
    Rotate_Wait       30s

# 生产 kubernetes FILTER（configmap.yaml:73-87）的本地替身：
# 构造同构 kubernetes map（ns/pod/container/labels）+ 仿真
# Merge_Log On + Merge_Log_Key log_processed + Keep_Log On 三件套
[FILTER]
    Name    lua
    Match   from-rcoder
    script  /fluent-bit/etc/helpers.lua
    call    synthesize_k8s_meta

# 逐字复制（configmap.yaml:98-102）：kubernetes 元数据提升为顶层 key，供 Label_Keys 引用
[FILTER]
    Name    lua
    Match   from-rcoder
    script  /fluent-bit/etc/helpers.lua
    call    flatten_k8s_meta

# 逐字复制（configmap.yaml:108-119；仅 Match kube.* → from-rcoder）：
# 本地 ns=nuwax-k8s-test 走兜底规则 → loki_target.test
# （与 .131 彩排、nuwax-k8s-test 测试环境的真实路由一致）
[FILTER]
    Name              rewrite_tag
    Match             from-rcoder
    Rule              $ns ^nuwax-k8s-prod$ loki_target.prod false
    Rule              $ns ^nuwax-rcoder-prod$ loki_target.prod false
    Rule              $ns ^nuwax-k8s-dev$ loki_target.dev false
    Rule              $ns ^nuwax-rcoder-dev$ loki_target.dev false
    Rule              $ns .* loki_target.test false
    Emitter_Name              re_emitted
    # emitter 落盘: OOM 直接元凶 (默认内存缓冲, Loki 背压时无限堆积)
    Emitter_Storage.type      filesystem
    Emitter_Mem_Buf_Limit     10MB

# 生产 test OUTPUT 块逐字复制（configmap.yaml:132-144），占位符已按 deploy.sh 解析：
# @@LOKI_TEST_HOST@@ → loki（compose 服务名），@@LOKI_TEST_PORT@@ → 3100，
# @@NS@@/@@POD@@/@@CONTAINER@@ → $ns/$pod/$container
# Line_Format json（stage B）：B5 红灯复现后翻转——行体为 JSON，LogQL `| json`
# 可解析 log_processed_* 字段；key_value 形态的旧行仍可 `|=` 子串检索（Keep_Log 语义）
[OUTPUT]
    Name              loki
    Match             loki_target.test
    Host              loki
    Port              3100
    Labels            job=fluent-bit
    Label_Keys        $ns,$pod,$container
    Auto_Kubernetes_Labels On
    Remove_Keys       _stream,loki_target
    Line_Format       json
    Retry_Limit       10
    Compress          gzip
    Storage.Total_Limit_Size  512M
