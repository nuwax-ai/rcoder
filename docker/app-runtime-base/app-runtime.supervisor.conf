# app-runtime 固定服务:PostgreSQL + pgweb + ttyd
# app-cli 由 start-app.sh 生成 /etc/supervisor/conf.d/99-app.conf，并负责用户服务、
# Pingap、健康检查与日志读取。
# priority 小的先启动(PG 先于依赖它的 pgweb/app),但 supervisor 不等 ready,
# 依赖 autorestart + 应用层重试兜底(pgweb/app 连 PG 失败会重启重试直到 PG 就绪)
#
# 路径契约（prod 四目录压平挂载）: workspace=$USERAPP_WORKSPACE_DIR（rcoder 创建
# 容器时注入 /home/user/{app_id}，本地直跑未注入时 start-app.sh 缺省回退 /app）、
# 数据=/home/user/data、日志=/home/user/logs（data/logs 为挂载卷，随卷持久化）。

[program:postgresql]
command=/usr/local/bin/pg-supervisor-entry.sh
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/home/user/logs/pg.out.log
stderr_logfile=/home/user/logs/pg.err.log
environment=PGDATA="%(ENV_PGDATA)s"

[program:pgweb]
# --skip-open: 禁止 pgweb 启动时 xdg-open 自动开浏览器 (否则拉的 chromium 会跟 chrome-devtools-mcp 抢 user-data-dir + 调试端口 9222)
command=/usr/local/bin/pgweb --bind=0.0.0.0 --listen=%(ENV_PGWEB_PORT)s --sessions --skip-open
priority=20
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/home/user/logs/pgweb.out.log
stderr_logfile=/home/user/logs/pgweb.err.log

# dbx-web(DBX 数据库 Web GUI,60+ 数据库):无 CLI 参数,全 env 配置(DBX_PORT/DBX_STATIC_DIR/DBX_DATA_DIR
# 继承自 start-app.sh 导出环境)。首访浏览器设密码(存 $DBX_DATA_DIR/dbx.db);固定密码注入 DBX_PASSWORD env。
[program:dbx]
command=/usr/local/bin/dbx-web
priority=25
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/home/user/logs/dbx.out.log
stderr_logfile=/home/user/logs/dbx.err.log

# file-server-proxy(60000, 单二进制直连): 对外唯一文件入口（K8s Service 固定端口，
# rcoder 转发层 x-app-stage: prod 的上游）。0.2.0 起 file-server 以 lib 进程内直连
# 集成——无独立 8086 进程/端口。USERAPP_SINGLE_APP_ID/USERAPP_WORKSPACE_DIR 取容器
# env（rcoder 创建时注入；单 app 模式=卷根即 app 根、拒绝跨 app 访问。空 APP_ID
# (本地直跑)=多 app 开发语义，此时 WORKSPACE_DIR 缺省 /app）。EMBED_FILE_SERVER=1
# 显式启用直连；ROUTE_POLICY 恒 all_rust（容器语义）。
[program:file-server-proxy]
command=/usr/local/bin/file-server-proxy
priority=35
autostart=true
autorestart=true
startsecs=2
startretries=5
stdout_logfile=/home/user/logs/file-server-proxy.out.log
stderr_logfile=/home/user/logs/file-server-proxy.err.log
environment=FILE_SERVER_PORT="60000",ROUTE_POLICY="all_rust",EMBED_FILE_SERVER="1",USERAPP_WORKSPACE_DIR="%(ENV_USERAPP_WORKSPACE_DIR)s",USERAPP_SINGLE_APP_ID="%(ENV_APP_ID)s",FILE_SERVER_LOG_DIR="/home/user/logs/file-server",RUST_LOG="info"

[program:ttyd]
command=/usr/local/bin/start-ttyd.sh
priority=30
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/home/user/logs/ttyd.out.log
stderr_logfile=/home/user/logs/ttyd.err.log
