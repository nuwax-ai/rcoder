# app-runtime 固定服务:PostgreSQL + pgweb + ttyd
# 用户应用由 start-app.sh 动态生成 /etc/supervisor/conf.d/99-app.conf
# priority 小的先启动(PG 先于依赖它的 pgweb/app),但 supervisor 不等 ready,
# 依赖 autorestart + 应用层重试兜底(pgweb/app 连 PG 失败会重启重试直到 PG 就绪)

[program:postgresql]
command=/usr/local/bin/pg-supervisor-entry.sh
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/app/logs/pg.out.log
stderr_logfile=/app/logs/pg.err.log
environment=PGDATA="%(ENV_PGDATA)s"

[program:pgweb]
# --skip-open: 禁止 pgweb 启动时 xdg-open 自动开浏览器 (否则拉的 chromium 会跟 chrome-devtools-mcp 抢 user-data-dir + 调试端口 9222)
command=/usr/local/bin/pgweb --bind=0.0.0.0 --listen=%(ENV_PGWEB_PORT)s --sessions --skip-open
priority=20
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/app/logs/pgweb.out.log
stderr_logfile=/app/logs/pgweb.err.log

[program:ttyd]
command=/usr/local/bin/start-ttyd.sh
priority=30
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/app/logs/ttyd.out.log
stderr_logfile=/app/logs/ttyd.err.log
