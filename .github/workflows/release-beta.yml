# Release Beta CI - 测试版本发布
# 触发条件: push beta tag (如 v1.0.0-beta.1, 1.0.0-beta.1)
# npm tag: beta

name: Release Beta

permissions:
  "contents": "write"

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-beta*'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'

jobs:
  # ============================================================
  # Step 1: 提取版本信息
  # ============================================================
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      tag: ${{ github.ref_name }}
      version: ${{ steps.version.outputs.version }}
      base-version: ${{ steps.version.outputs.base-version }}
    steps:
      - name: Extract version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # 提取基础版本 (去掉 -beta.x 后缀)
          BASE_VERSION="${VERSION%%-*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base-version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"
          echo "Version: $VERSION"
          echo "Base Version: $BASE_VERSION"

  # ============================================================
  # Step 2: 使用 cargo-dist 构建平台二进制
  # ============================================================
  build:
    needs: plan
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install protoc
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            PROTOC_ARCH="linux-aarch_64"
          else
            PROTOC_ARCH="linux-x86_64"
          fi
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-${PROTOC_ARCH}.zip"
          unzip "protoc-25.1-${PROTOC_ARCH}.zip" -d $HOME/.local
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dist
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      # 使用基础版本号让 cargo-dist 能够识别
      - name: Plan build
        id: plan
        run: |
          # 临时修改 Cargo.toml 版本为基础版本，让 cargo-dist 能工作
          BASE_VERSION="${{ needs.plan.outputs.base-version }}"
          sed -i "s/version = \".*\"/version = \"$BASE_VERSION\"/" crates/rcoder-cli/Cargo.toml

          dist host --steps=create --tag=v$BASE_VERSION --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Build artifacts
        run: |
          BASE_VERSION="${{ needs.plan.outputs.base-version }}"
          dist build --tag=v$BASE_VERSION --print=linkage --output-format=json > dist-manifest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.zip

  # ============================================================
  # Step 3: 创建 GitHub Release 并发布 npm
  # ============================================================
  release:
    needs: [plan, build]
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      # 下载构建产物
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: binaries/

      # 创建 GitHub Release
      - name: Create GitHub Release
        run: |
          echo "Creating prerelease: $TAG"
          gh release create "$TAG" \
            --prerelease \
            --title "Beta Release $TAG" \
            --notes "Beta release for testing" \
            binaries/*

      # 准备 npm 包
      - name: Prepare npm packages
        run: |
          VERSION="${{ env.VERSION }}"

          # 更新所有 package.json 版本
          for dir in npm/*/; do
            if [ -f "$dir/package.json" ]; then
              jq --arg v "$VERSION" '.version = $v' "$dir/package.json" > "$dir/package.json.tmp"
              mv "$dir/package.json.tmp" "$dir/package.json"
            fi
          done

          # 更新主包的 optionalDependencies 版本
          jq --arg v "$VERSION" '
            .optionalDependencies["@rcoder/cli-linux-x64"] = $v |
            .optionalDependencies["@rcoder/cli-linux-arm64"] = $v |
            .optionalDependencies["@rcoder/cli-darwin-x64"] = $v |
            .optionalDependencies["@rcoder/cli-darwin-arm64"] = $v |
            .optionalDependencies["@rcoder/cli-win32-x64"] = $v
          ' npm/rcoder-cli/package.json > npm/rcoder-cli/package.json.tmp
          mv npm/rcoder-cli/package.json.tmp npm/rcoder-cli/package.json

      # 解压二进制文件
      - name: Extract binaries
        run: |
          ls -la binaries/

          # 解压 Linux x64
          mkdir -p npm/rcoder-cli-linux-x64
          tar -xf binaries/rcoder-cli-x86_64-unknown-linux-gnu.tar.xz -C npm/rcoder-cli-linux-x64

          # 解压 Linux arm64
          mkdir -p npm/rcoder-cli-linux-arm64
          tar -xf binaries/rcoder-cli-aarch64-unknown-linux-gnu.tar.xz -C npm/rcoder-cli-linux-arm64

          # 解压 macOS x64
          mkdir -p npm/rcoder-cli-darwin-x64
          tar -xf binaries/rcoder-cli-x86_64-apple-darwin.tar.xz -C npm/rcoder-cli-darwin-x64

          # 解压 macOS arm64
          mkdir -p npm/rcoder-cli-darwin-arm64
          tar -xf binaries/rcoder-cli-aarch64-apple-darwin.tar.xz -C npm/rcoder-cli-darwin-arm64

          # 解压 Windows x64
          mkdir -p npm/rcoder-cli-win32-x64
          unzip binaries/rcoder-cli-x86_64-pc-windows-msvc.zip -d npm/rcoder-cli-win32-x64

          # 显示结果
          echo "=== Package contents ==="
          for dir in npm/*/; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "--- $dir ---"
              ls -la "$dir" | head -5
            fi
          done

      # 发布 npm 包
      - name: Publish npm packages
        run: |
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

          # 发布平台包
          for pkg in npm/rcoder-cli-*; do
            if [ -f "$pkg/package.json" ]; then
              pkgName=$(jq -r '.name' "$pkg/package.json")
              echo "Publishing $pkgName with beta tag..."
              npm publish "$pkg" --access public --tag beta || echo "Warning: Failed to publish $pkgName"
            fi
          done

          # 发布主包
          echo "Publishing rcoder-cli with beta tag..."
          npm publish npm/rcoder-cli --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ============================================================
  # Step 4: 发布公告
  # ============================================================
  announce:
    needs: [plan, release]
    runs-on: "ubuntu-22.04"
    steps:
      - name: Summary
        run: |
          echo "## Beta Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.plan.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ needs.plan.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **npm tag**: beta" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "npm install -g rcoder-cli@beta" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
