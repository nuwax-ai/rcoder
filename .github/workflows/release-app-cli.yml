name: release-app-cli

# 发布 app-cli（UserApp 容器运行时编排器 + 本地编译工具）到公开 npmjs.org：
# 主包 @nuwax-ai/app-cli（wrapper）+ 五个平台子包（二进制直打 tarball，
# optionalDependencies 按平台装）。供模板仓库 Dockerfile `npm i -g` 自包含取用；
# win32-x64 子包额外附带自建 rustls 版 pingap.exe（上游 pingap 官方无 Windows
# 产物，serve 的反代依赖由本 workflow 从 pin 的同一 git rev 构建）。
# 触发：推 tag `app-cli-v*`（稳定 / 预发布）或手动 workflow_dispatch。
# 与 release.yml（`v*`）/ release-file-server-proxy.yml 靠 tag 前缀隔离。
#
# 版本纪律：单一事实源 = crates/app-cli/Cargo.toml 的 version。发版流程 =
# 改 Cargo.toml 版本 → 在该 commit 打同版本 tag `app-cli-v<VERSION>`；meta job
# 强校验一致，不一致 fail-fast。仓库内 npm 包 version 恒为占位 0.0.0（CI 注入）。
#
# 需在仓库 Secrets 配置（复用现有）：NPM_TOKEN —— 发布 @nuwax-ai/* 到公开 npmjs.org。
#
# 构建策略（对齐 release-file-server-proxy.yml 的验证路径）：
# - linux gnu 双架构走 cargo-zigbuild（zig 通用 C 工具链，给 aws-lc-sys 提供交叉
#   CC），glibc 钉 2.17 —— 低于 rust:bookworm(2.36) 与 debian:12 基线，产物
#   在所有支持的目标运行时直接可用；勿改为 ubuntu runner 裸编（glibc 2.39 产物
#   在 bookworm 上不可运行）。
# - darwin 双架构：macos-latest native（x64 加 target 交叉）。
# - windows x64：windows-latest native。app-cli.exe 的 aws-lc-sys（reqwest rustls）
#   需要 protoc+nasm+cmake（cmake 预装）。
# - pingap.exe：独立 job，由 source_identity 核对 Cargo.toml 与 devtool 的
#   官方版本/rev（单一事实源，漂移即失败）→ checkout exact pin → 校验并应用配对 patch →
#   `--no-default-features --features tls-rustls`（aws-lc provider，需 nasm/cmake；
#   checkout 后准备 dist/index.html，无需 build-web）。与 app-cli 的 pingap-config 库严格同 rev。
# - pair-gate：Windows 和既有三个 Unix 随包平台实际执行 app-cli gen-lock，
#   生成配置喂同版 Pingap -t，验证分发二进制对的 schema 兼容性。

on:
  push:
    tags:
      - "app-cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，如 app-cli-v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - id: v
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          [[ "$TAG" == app-cli-v* ]] || { echo "✗ expected an app-cli-v* tag"; exit 1; }
          # 手动重发必须构建指定 tag，不能把分支源码发布成另一个 tag 的版本。
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")" ] || {
            echo "✗ checkout does not match release tag $TAG"; exit 1; }
          VERSION="${TAG#app-cli-v}"
          # 版本一致性守卫：tag 必须与 crates/app-cli/Cargo.toml 的 version 一致
          grep -q "^version = \"${VERSION}\"" crates/app-cli/Cargo.toml || {
            echo "✗ tag(${TAG}) 与 crates/app-cli/Cargo.toml version 不一致："
            grep '^version' crates/app-cli/Cargo.toml
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,     runner: macos-latest,  zig: false }
          - { target: x86_64-apple-darwin,       runner: macos-latest,  zig: false }
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-latest, zig: true }
          - { target: x86_64-pc-windows-msvc,    runner: windows-latest, zig: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # 显式选择并更新 stable；不依赖 runner 默认值或不存在的 toolchain 文件。
      - name: Update and record Rust stable + target
        shell: bash
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}
          rustc --version
          cargo --version

      # protoc：pingap-config → etcd-client → tonic-prost → prost-build 构建期调用；
      # aws-lc-sys 需要 cmake（macos 镜像自带；ubuntu/windows 加装）+ nasm（windows，
      # aws-lc 汇编；与 release-file-server-proxy.yml 同款路径）。
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc + nasm (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install protoc nasm -y --no-progress
          echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"

      # linux 双架构走 cargo-zigbuild（glibc 钉 2.17，见文件头注释）。
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: pip3 install ziglang cargo-zigbuild

      # shell: bash 必须显式——Windows 默认 PowerShell 解析不了 bash 语法
      #（Linux/macOS 默认 bash 不受影响）
      - name: Build app-cli
        working-directory: crates/app-cli
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_ZIG: ${{ matrix.zig }}
        run: |
          if [ "$USE_ZIG" = "true" ]; then
            cargo zigbuild --locked --release --target "${TARGET}.2.17"
          else
            cargo build --locked --release --target "$TARGET"
          fi

      - name: Smoke test binary --version
        working-directory: crates/app-cli
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          TARGET_ARCH="ARM64"
          case "$TARGET" in x86_64-*) TARGET_ARCH="X64" ;; esac
          BIN=app-cli
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=app-cli.exe; fi
          if [ "$TARGET_ARCH" = "${{ runner.arch }}" ]; then
            ./target/${TARGET}/release/${BIN} --version
          else
            echo "交叉产物（宿主架构不匹配），跳过冒烟"
          fi

      # 二进制重命名为 app-cli-<target>[.exe]：download-artifact merge-multiple 合并后
      # 各平台文件名不冲突（原名同为 app-cli 会互相覆盖）。
      - name: Rename binary for artifact
        working-directory: crates/app-cli
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          BIN=app-cli
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=app-cli.exe; fi
          cp "target/${TARGET}/release/${BIN}" "app-cli-${TARGET}$( [ "${{ runner.os }}" = "Windows" ] && echo ".exe" )"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-cli-${{ matrix.target }}
          path: crates/app-cli/app-cli-${{ matrix.target }}*
          retention-days: 7

  gate-pingap-applied:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve the paired exact source pin
        run: |
          python3 - <<'PY'
          import os
          from tools.build.pingap_identity import source_identity
          identity = source_identity()
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('PINGAP_REV=' + identity['commit'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: vicanso/pingap
          ref: ${{ env.PINGAP_REV }}
          path: .pingap-source
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config cmake
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy,rustfmt
      - name: Apply paired source and provide admin informational page
        run: |
          python3 tools/build/pingap-applied/apply.py --source .pingap-source --repo-root .
          mkdir -p .pingap-source/dist
          printf '%s\n' '<!doctype html><title>RCoder Pingap JSON API</title>' > .pingap-source/dist/index.html
      - name: Default feature tests and strict Clippy
        working-directory: .pingap-source
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p pingap --bin pingap --no-fail-fast -- --test-threads=1
          cargo test --locked -p pingap-cache -p pingap-plugin -p pingap-core -p pingap-proxy --lib --no-fail-fast -- --test-threads=1
          cargo test --locked -p pingap-config --test applied_digest --features serde_json/preserve_order
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Full feature tests and strict Clippy
        working-directory: .pingap-source
        run: |
          cargo test --locked -p pingap --bin pingap --features full --no-fail-fast -- --test-threads=1
          cargo test --locked -p pingap -p pingap-cache -p pingap-plugin -p pingap-core -p pingap-proxy --lib --features full --no-fail-fast -- --test-threads=1
          cargo clippy --locked --workspace --all-targets --features full -- -D warnings

  # ── pingap.exe（Windows 专用，随 win32-x64 平台包分发）─────────────────────
  # 上游 pingap 官方无 Windows 产物。构建源 = app-cli Cargo.toml pin 的同一
  # git rev（统一 source_identity，漂移即 fail-fast）。
  # rustls 变体使用 aws-lc-sys → protoc + MSVC + nasm/cmake；checkout 后
  # 自建 dist/index.html（rust-embed 可编译），无需 node build-web；代价是 admin
  # web UI 为占位页（app-cli 只消费 admin JSON API，不受影响）。
  build-pingap-windows:
    needs: meta
    env:
      RUSTUP_TOOLCHAIN: stable
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout rcoder (for pin rev)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve pingap rev from Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from tools.build.pingap_identity import source_identity
          identity = source_identity()
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('PINGAP_REV=' + identity['commit'] + '\n')
              stream.write('PINGAP_VERSION_EXPECTED=' + identity['version'] + '\n')
          print(identity)
          PY

      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Checkout pingap at pinned rev
        uses: actions/checkout@v4
        with:
          repository: vicanso/pingap
          ref: ${{ env.PINGAP_REV }}
          path: .pingap-source

      - name: Apply reviewed paired Pingap protocol patch
        shell: bash
        run: python tools/build/pingap-applied/apply.py --source .pingap-source --repo-root .

      - name: Install protoc
        shell: bash
        run: |
          choco install protoc nasm cmake -y --no-progress
          echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"

      # job 环境使上游 checkout 的 toolchain 配置不能覆盖本轮 stable。
      - name: Update and record Rust stable
        shell: bash
        run: |
          rustup update stable
          rustc --version
          cargo --version

      # 不加 full：官方 full 只多 tracing/imageoptim，app-cli 生成的配置用不到，
      # 省约一半编译时间。上游 profile lto=true + codegen-units=1，构建慢属预期。
      - name: Build pingap (tls-rustls)
        shell: bash
        run: python tools/build/pingap-applied/build.py --source .pingap-source --repo-root . --already-applied --tls rustls --output pingap.exe

      - name: Smoke test pingap -V
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(./pingap.exe -V)
          echo "$OUT"
          [ "$(./pingap.exe --apply-protocol-version)" = "1" ]
          # 版本断言：二进制版本必须与 devtool 常量（= pingap-config pin 的 tag）一致
          [ "$OUT" = "pingap $PINGAP_VERSION_EXPECTED" ] || {
            echo "✗ pingap.exe 版本与 pin 的 $PINGAP_VERSION_EXPECTED 不符"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingap-x86_64-pc-windows-msvc
          path: |
            pingap.exe
            pingap.exe.applied.json
          retention-days: 7

  # ── pingap（Unix 随包）：N04——普通 Mac/Linux 用户仅装包即可运行完整链 ────
  # 与 Windows 同源约束：构建 rev = app-cli Cargo.toml pin 的同一 commit，
  # tls-rustls feature，版本断言。产物并入对应平台子包。
  build-pingap-unix:
    needs: meta
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin,      runner: macos-latest,  zig: false }
          - { target: aarch64-apple-darwin,     runner: macos-latest,  zig: false }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, zig: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout rcoder (for pin rev)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve pingap rev from Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from tools.build.pingap_identity import source_identity
          identity = source_identity()
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('PINGAP_REV=' + identity['commit'] + '\n')
              stream.write('PINGAP_VERSION_EXPECTED=' + identity['version'] + '\n')
          print(identity)
          PY

      - name: Checkout pingap at pinned rev
        uses: actions/checkout@v4
        with:
          repository: vicanso/pingap
          ref: ${{ env.PINGAP_REV }}
          path: .pingap-source

      - name: Apply reviewed paired Pingap protocol patch
        shell: bash
        run: python tools/build/pingap-applied/apply.py --source .pingap-source --repo-root .

      - name: Install protoc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macos)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # job 环境使上游 checkout 的 toolchain 配置不能覆盖本轮 stable。
      - name: Update and record Rust stable
        shell: bash
        run: |
          rustup update stable
          rustc --version
          cargo --version

      # 随包 Pingap 与 app-cli 保持同一 Linux glibc 基线，不能由 Ubuntu
      # 原生链接器把 libc 2.38/2.39 的强符号带进 Debian 12 用户的包。
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: pip3 install ziglang cargo-zigbuild

      # darwin arm64 runner 原生；x86_64-apple-darwin 用 --target 交叉（同 runner）
      - name: Build pingap (tls-rustls)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_ZIG: ${{ matrix.zig }}
        run: |
          set -euo pipefail
          if [ "$USE_ZIG" = "true" ]; then
            python3 tools/build/pingap-applied/build.py --source .pingap-source --repo-root . --already-applied --tls rustls --target "$TARGET" --zig-glibc 2.17 --output pingap-out
          elif [ "$TARGET" = "x86_64-apple-darwin" ]; then
            rustup target add x86_64-apple-darwin
            python3 tools/build/pingap-applied/build.py --source .pingap-source --repo-root . --already-applied --tls rustls --target "$TARGET" --output pingap-out
          else
            python3 tools/build/pingap-applied/build.py --source .pingap-source --repo-root . --already-applied --tls rustls --output pingap-out
          fi

      - name: Verify Linux Pingap glibc baseline
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          versions = subprocess.check_output(["objdump", "--private-headers", "pingap-out"], text=True)
          required = [tuple(map(int, value.split("."))) for value in re.findall(r"GLIBC_([0-9]+(?:\.[0-9]+)+)", versions)]
          if not required or max(required) > (2, 17):
              raise SystemExit(f"Pingap must require glibc <= 2.17; observed {sorted(set(required))}")
          print("Pingap glibc baseline:", ".".join(map(str, max(required))))
          PY

      - name: Install Rosetta for the x64 macOS executable gate
        if: matrix.target == 'x86_64-apple-darwin' && runner.arch == 'ARM64'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Smoke test pingap -V
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(./pingap-out -V)
          echo "$OUT"
          [ "$(./pingap-out --apply-protocol-version)" = "1" ]
          [ "$OUT" = "pingap $PINGAP_VERSION_EXPECTED" ] || {
            echo "✗ pingap 版本与 pin 的 $PINGAP_VERSION_EXPECTED 不符"; exit 1; }

      # merge-multiple 按文件名合并；artifact 名称不会重命名其中的文件。
      - name: Name binary by target
        shell: bash
        run: |
          mv pingap-out "pingap-${{ matrix.target }}"
          mv pingap-out.applied.json "pingap-${{ matrix.target }}.applied.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingap-${{ matrix.target }}
          path: |
            pingap-${{ matrix.target }}
            pingap-${{ matrix.target }}.applied.json
          if-no-files-found: error
          retention-days: 7

  # ── 成对一致性 gate：分发的 app-cli.exe ↔ pingap.exe schema 兼容 ──────────
  # fixture workspace 跑 gen-lock（纯函数生成配置）→ 提取 pingap.toml →
  # pingap.exe -t 校验。本地（darwin）已验证过该链路，CI 在目标平台复验。
  pair-gate-windows:
    needs: [meta, build, build-pingap-windows, gate-pingap-applied]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Gen lock with fixture and validate via pingap -t
        shell: bash
        run: |
          set -euo pipefail
          APP=dist/app-cli-x86_64-pc-windows-msvc.exe
          PINGAP=dist/pingap.exe
          ls -lh "$APP" "$PINGAP"
          python - "$PINGAP" <<'PY'
          import subprocess, sys
          from tools.build.pingap_identity import parse_pingap_version, source_identity
          if subprocess.check_output([sys.argv[1], '--apply-protocol-version'], text=True).strip() != '1':
              raise SystemExit('Distributed Pingap lacks applied-status protocol 1')
          observed = parse_pingap_version(subprocess.check_output([sys.argv[1], '-V'], text=True))
          if observed != source_identity()['version']:
              raise SystemExit('Distributed Pingap version disagrees with app-cli source')
          PY
          WS=$(mktemp -d)/ws
          cp -r crates/app-cli/tests/fixtures/minimal-workspace "$WS"
          "$APP" gen-lock --workspace "$WS" 2>/dev/null \
            | sed -n '/──── pingap.toml ────/,/──── end ────/p' | sed '1d;$d' \
            > pingap.toml
          [ -s pingap.toml ]
          head -5 pingap.toml
          "$PINGAP" -c pingap.toml -t
          echo "✓ pair gate passed: app-cli 生成的配置被同 rev pingap.exe 接受"

  # Unix 的三个既有随包平台同样验证实际分发的二进制对。
  pair-gate-unix:
    needs: [meta, build, build-pingap-unix, gate-pingap-applied]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, runner: macos-latest }
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: app-cli-${{ matrix.target }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pingap-${{ matrix.target }}
          path: dist
      - name: Install Rosetta for the x64 macOS pair gate
        if: matrix.target == 'x86_64-apple-darwin' && runner.arch == 'ARM64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Validate the distributed Unix pair
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          APP="dist/app-cli-$TARGET"
          PINGAP="dist/pingap-$TARGET"
          chmod +x "$APP" "$PINGAP"
          python - "$PINGAP" <<'PY'
          import subprocess, sys
          from tools.build.pingap_identity import parse_pingap_version, source_identity
          if subprocess.check_output([sys.argv[1], '--apply-protocol-version'], text=True).strip() != '1':
              raise SystemExit('Distributed Pingap lacks applied-status protocol 1')
          observed = parse_pingap_version(subprocess.check_output([sys.argv[1], '-V'], text=True))
          if observed != source_identity()['version']:
              raise SystemExit('Distributed Pingap version disagrees with app-cli source')
          PY
          WS=$(mktemp -d)/ws
          cp -r crates/app-cli/tests/fixtures/minimal-workspace "$WS"
          "$APP" gen-lock --workspace "$WS" 2>/dev/null \
            | sed -n '/──── pingap.toml ────/,/──── end ────/p' | sed '1d;$d' > pingap.toml
          [ -s pingap.toml ]
          "$PINGAP" -c pingap.toml -t

  publish-npm:
    needs: [meta, pair-gate-windows, pair-gate-unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check launcher and platform package contents
        run: node --test npm/app-cli/test/launcher.test.cjs

      - name: Stamp versions + place binaries
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # 版本注入：6 个 package.json + 主包 optionalDependencies（scoped key）
          for dir in npm/app-cli npm/app-cli-linux-x64 npm/app-cli-linux-arm64 npm/app-cli-darwin-x64 npm/app-cli-darwin-arm64 npm/app-cli-windows-x64; do
            jq --arg v "$VERSION" '.version = $v' "$dir/package.json" > "$dir/package.json.tmp" && mv "$dir/package.json.tmp" "$dir/package.json"
          done
          jq --arg v "$VERSION" '
            .optionalDependencies["@nuwax-ai/app-cli-linux-x64"] = $v |
            .optionalDependencies["@nuwax-ai/app-cli-linux-arm64"] = $v |
            .optionalDependencies["@nuwax-ai/app-cli-darwin-x64"] = $v |
            .optionalDependencies["@nuwax-ai/app-cli-darwin-arm64"] = $v |
            .optionalDependencies["@nuwax-ai/app-cli-windows-x64"] = $v
          ' npm/app-cli/package.json > npm/app-cli/package.json.tmp && mv npm/app-cli/package.json.tmp npm/app-cli/package.json

          # 守卫：主包 optionalDependencies 的 key 集 == 平台子包目录集（防加平台漏改）
          DEP_KEYS=$(jq -r '.optionalDependencies | keys[]' npm/app-cli/package.json | sed 's/@nuwax-ai\///' | sort)
          DIR_KEYS=$(ls -d npm/app-cli-* | sed 's|npm/||' | sort)
          [ "$DEP_KEYS" = "$DIR_KEYS" ] || {
            echo "✗ 平台包目录与 optionalDependencies 不一致:"; echo "$DEP_KEYS"; echo "---"; echo "$DIR_KEYS"; exit 1; }

          # 二进制就位（target triple → 平台包目录）
          cp dist/app-cli-x86_64-unknown-linux-gnu  npm/app-cli-linux-x64/app-cli
          cp dist/app-cli-aarch64-unknown-linux-gnu npm/app-cli-linux-arm64/app-cli
          cp dist/app-cli-x86_64-apple-darwin       npm/app-cli-darwin-x64/app-cli
          cp dist/app-cli-aarch64-apple-darwin      npm/app-cli-darwin-arm64/app-cli
          # N04：全平台随包 pingap（同 rev 自建 tls-rustls；配置契约与
          # app-cli 的 pingap-config 严格配对）——仅装包即可运行完整链
          cp dist/pingap-x86_64-apple-darwin        npm/app-cli-darwin-x64/pingap
          cp dist/pingap-aarch64-apple-darwin       npm/app-cli-darwin-arm64/pingap
          cp dist/pingap-x86_64-unknown-linux-gnu   npm/app-cli-linux-x64/pingap
          # linux-arm64 随包 pingap 尚无构建 job（官方 zig 交叉待定）——
          # 该平台 serve 需另装系统 pingap（缺失时 --pingap-bin 显式指定）
          # win32 包双件套：app-cli.exe + 自建 pingap.exe（serve 反代依赖）
          cp dist/app-cli-x86_64-pc-windows-msvc.exe npm/app-cli-windows-x64/app-cli.exe
          cp dist/pingap.exe                          npm/app-cli-windows-x64/pingap.exe
          cp dist/pingap-x86_64-apple-darwin.applied.json npm/app-cli-darwin-x64/pingap.applied.json
          cp dist/pingap-aarch64-apple-darwin.applied.json npm/app-cli-darwin-arm64/pingap.applied.json
          cp dist/pingap-x86_64-unknown-linux-gnu.applied.json npm/app-cli-linux-x64/pingap.applied.json
          cp dist/pingap.exe.applied.json              npm/app-cli-windows-x64/pingap.exe.applied.json
          chmod +x npm/app-cli-*/app-cli npm/app-cli-*/pingap npm/app-cli-windows-x64/*.exe

          # 冒烟：runner(x64 linux, glibc ≥ 2.17) 直接跑二进制验证可执行
          ./npm/app-cli-linux-x64/app-cli --version

      # 发布顺序：先平台包后主包（主包 optionalDependencies 指向平台包版本，
      # 反序会在安装窗口出现解析失败）。prerelease 发 beta dist-tag。
      - name: Publish platform packages
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          TAG_ARGS=""
          if [ "$PRERELEASE" = "true" ]; then TAG_ARGS="--tag beta"; fi
          failures=0
          for dir in app-cli-linux-x64 app-cli-linux-arm64 app-cli-darwin-x64 app-cli-darwin-arm64 app-cli-windows-x64; do
            (cd "$dir" && npm publish --access public $TAG_ARGS --registry https://registry.npmjs.org) || failures=$((failures+1))
          done
          [ "$failures" -eq 0 ] || { echo "✗ $failures 个平台包发布失败"; exit 1; }

      - name: Publish main package
        working-directory: npm/app-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --access public --tag beta --registry https://registry.npmjs.org
          else
            npm publish --access public --registry https://registry.npmjs.org
          fi

  release:
    needs: [meta, pair-gate-windows, pair-gate-unix]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-cli-v${{ needs.meta.outputs.version }}
          name: app-cli ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.prerelease }}
          files: |
            dist/app-cli-aarch64-apple-darwin
            dist/app-cli-x86_64-apple-darwin
            dist/app-cli-x86_64-unknown-linux-gnu
            dist/app-cli-aarch64-unknown-linux-gnu
            dist/app-cli-x86_64-pc-windows-msvc.exe
            dist/pingap.exe
            dist/pingap-x86_64-apple-darwin
            dist/pingap-aarch64-apple-darwin
            dist/pingap-x86_64-unknown-linux-gnu
            dist/pingap.exe.applied.json
            dist/pingap-x86_64-apple-darwin.applied.json
            dist/pingap-aarch64-apple-darwin.applied.json
            dist/pingap-x86_64-unknown-linux-gnu.applied.json
