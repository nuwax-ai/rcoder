name: release-file-server-proxy

# 发布 file-server-proxy 二进制（default feature=embed-file-server 直连集成内嵌 rust file-server）
# 到阿里云 OSS + 发布 @nuwax-ai/file-server-proxy npm 包装包（依赖 nuwax-file-server 精确 pin）。
# 触发：推 tag `file-server-proxy-v*`（稳定 / 预发布）或手动 workflow_dispatch。
# 与 release-file-server.yml / rcoder release.yml 互不干扰——靠 tag 前缀隔离。
#
# 需在仓库 Secrets 配置（与 release-file-server.yml 复用同一组）：
#   OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET —— OSS 写权限（bucket nuwa-packages）
#   NPM_TOKEN —— 发布 @nuwax-ai/* 到公开 npmjs.org

on:
  push:
    tags:
      - "file-server-proxy-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，如 file-server-proxy-v0.1.0"
        required: true

permissions:
  contents: write

env:
  OSS_BUCKET: nuwa-packages
  OSS_ENDPOINT: oss-rg-china-mainland.aliyuncs.com
  OSS_PREFIX: file-server-proxy

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${GITHUB_REF}" = "${TAG}" ]; then
            # 非 tag 触发（workflow_dispatch），用输入
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#file-server-proxy-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # target / runner / 归档格式 / 是否用 cargo-zigbuild 交叉
          - { target: aarch64-apple-darwin,     runner: macos-latest,   archive: tar.gz, zig: false }
          - { target: x86_64-apple-darwin,       runner: macos-latest,   archive: tar.gz, zig: false }
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest,  archive: tar.gz, zig: false }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest,  archive: tar.gz, zig: true }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-latest,  archive: tar.gz, zig: true }
          - { target: x86_64-pc-windows-msvc,    runner: windows-latest, archive: zip,    zig: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # 读 rust-toolchain.toml（1.96.0）安装工具链，并加 matrix 目标。
      # 用 runner 自带 rustup，不依赖第三方 action 的输入语义。
      - name: Install Rust toolchain + target
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      # protoc/nasm 与 release-file-server.yml 同款保留：default embed 直连形态的
      # 依赖树包含 file-server 全树（prost/reqwest rustls aws-lc-rs），构建需求一致。
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc + nasm (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install protoc -y --no-progress
          # aws-lc-rs（reqwest rustls 的 crypto provider）在 msvc 下需要 nasm 做汇编
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"

      # musl / linux-arm64 用 cargo-zigbuild（zig 当通用 C 交叉工具链，
      # 给 reqwest rustls 的 aws-lc-rs 提供目标 C 编译器）。
      # ziglang 与 cargo-zigbuild 都在 PyPI 有预编译 wheel，pip 装比 cargo install 快。
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: pip3 install ziglang cargo-zigbuild

      - name: Build file-server-proxy
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_ZIG: ${{ matrix.zig }}
        run: |
          if [ "$USE_ZIG" = "true" ]; then
            cargo zigbuild --release --target "$TARGET" -p file-server-proxy --bin file-server-proxy
          else
            cargo build --release --target "$TARGET" -p file-server-proxy --bin file-server-proxy
          fi

      - name: Package archive
        shell: bash
        env:
          VER: ${{ needs.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          BIN=file-server-proxy
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=file-server-proxy.exe; fi
          ARTIFACT="file-server-proxy-${VER}-${TARGET}.${EXT}"
          cd "target/${TARGET}/release"
          if [ "$EXT" = "zip" ]; then
            7z a -tzip "$GITHUB_WORKSPACE/$ARTIFACT" "$BIN"
          else
            tar -czf "$GITHUB_WORKSPACE/$ARTIFACT" "$BIN"
          fi
          echo "Packaged $ARTIFACT"
          ls -lh "$GITHUB_WORKSPACE/$ARTIFACT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-server-proxy-${{ matrix.target }}
          path: file-server-proxy-${{ needs.meta.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
          retention-days: 7

  upload-oss:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install ossutil
        run: |
          set -euo pipefail
          curl -L -o ossutil https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil
          sudo mv ossutil /usr/local/bin/ossutil

      - name: Upload to Aliyun OSS
        env:
          AK: ${{ secrets.OSS_ACCESS_KEY_ID }}
          SK: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          BUCKET: ${{ env.OSS_BUCKET }}
          ENDPOINT: ${{ env.OSS_ENDPOINT }}
          PREFIX: ${{ env.OSS_PREFIX }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          for f in *.tar.gz *.zip; do
            [ -e "$f" ] || continue
            echo "Uploading $f -> oss://${BUCKET}/${PREFIX}/v${VER}/$f"
            ossutil cp "$f" "oss://${BUCKET}/${PREFIX}/v${VER}/$f" \
              -i "$AK" -k "$SK" -e "$ENDPOINT" --acl public-read -f
          done

      # 生成 manifest（每平台 sha256 + size + url），作为消费者（Electron prepare 脚本等）
      # 的单一事实源：按 plat-arch key 选资产 + 校验完整性 + 发现版本。
      - name: Generate manifest (sha256 + per-target metadata)
        env:
          VER: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          COMMIT: ${{ github.sha }}
          BUCKET: ${{ env.OSS_BUCKET }}
          ENDPOINT: ${{ env.OSS_ENDPOINT }}
          PREFIX: ${{ env.OSS_PREFIX }}
        run: |
          set -euo pipefail
          cd dist
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE_URL="https://${BUCKET}.${ENDPOINT}/${PREFIX}/v${VER}"
          VERPREFIX="file-server-proxy-${VER}-"
          targets='{}'
          for f in *.tar.gz *.zip; do
            [ -e "$f" ] || continue
            rest=${f#${VERPREFIX}}
            triple=${rest%.tar.gz}
            triple=${triple%.zip}
            case "$triple" in
              aarch64-apple-darwin)      key=darwin-arm64 ;;
              x86_64-apple-darwin)       key=darwin-x64 ;;
              x86_64-unknown-linux-gnu)  key=linux-x64 ;;
              x86_64-unknown-linux-musl) key=linux-x64-musl ;;
              aarch64-unknown-linux-gnu) key=linux-arm64 ;;
              x86_64-pc-windows-msvc)    key=win32-x64 ;;
              *) echo "WARN: skip unknown triple: $triple"; continue ;;
            esac
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            size=$(stat -c%s "$f")
            targets=$(jq --arg k "$key" --arg t "$triple" --arg a "$f" \
                           --arg s "$sha" --argjson sz "$size" --arg u "${BASE_URL}/${f}" \
                           '. + {($k): {rustTarget:$t, archive:$a, sha256:$s, size:$sz, url:$u}}' <<<"$targets")
          done
          jq -n --arg name file-server-proxy --arg ver "$VER" --arg commit "$COMMIT" \
                --arg date "$DATE" --argjson pre "$PRERELEASE" --argjson targets "$targets" \
                '{name:$name, version:$ver, commit:$commit, publishedAt:$date, prerelease:$pre, targets:$targets}' \
                > "manifest-${VER}.json"
          echo "Generated manifest-${VER}.json:"
          cat "manifest-${VER}.json"

      - name: Upload manifest to Aliyun OSS
        env:
          AK: ${{ secrets.OSS_ACCESS_KEY_ID }}
          SK: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          BUCKET: ${{ env.OSS_BUCKET }}
          ENDPOINT: ${{ env.OSS_ENDPOINT }}
          PREFIX: ${{ env.OSS_PREFIX }}
          VER: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd dist
          ossutil cp "manifest-${VER}.json" "oss://${BUCKET}/${PREFIX}/manifest/${VER}.json" \
            -i "$AK" -k "$SK" -e "$ENDPOINT" --acl public-read -f
          if [ "$PRERELEASE" = "true" ]; then
            ossutil cp "manifest-${VER}.json" "oss://${BUCKET}/${PREFIX}/manifest/beta.json" \
              -i "$AK" -k "$SK" -e "$ENDPOINT" --acl public-read -f
          else
            ossutil cp "manifest-${VER}.json" "oss://${BUCKET}/${PREFIX}/manifest/latest.json" \
              -i "$AK" -k "$SK" -e "$ENDPOINT" --acl public-read -f
          fi

      - name: Attach manifest as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: dist/manifest-${{ needs.meta.outputs.version }}.json

  publish-npm:
    needs: [meta, upload-oss]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Stamp version into package.json
        working-directory: crates/file-server-proxy/npm
        run: npm version "${{ needs.meta.outputs.version }}" --allow-same-version --no-git-tag-version

      - name: Publish to npm
        working-directory: crates/file-server-proxy/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ needs.meta.outputs.prerelease }}" = "true" ]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi

  release:
    needs: [meta, upload-oss]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-server-proxy-v${{ needs.meta.outputs.version }}
          name: file-server-proxy ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.prerelease }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/manifest-*.json
